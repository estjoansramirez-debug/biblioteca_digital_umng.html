pacial"},{"t":"p","h":"A continuación se presentan los mapas que ubican geográficamente el lugar donde se realiza la investigación y el lugar desde donde se desarrolla. Se parte de lo general a lo particular: la ubicación de Colombia en el mundo, el mapa político del país, el municipio de Chía, donde funciona la planta de Parmalat Ltda., el municipio de Cajicá y, por último, la Universidad Militar Nueva Granada. Los mapas permiten ver con claridad el contexto del estudio.","x":"A continuación se presentan los mapas que ubican geográficamente el lugar donde se realiza la investigación y el lugar desde donde se desarrolla. Se parte de lo general a lo particular: la ubicación de Colombia en el mundo, el mapa político del país, el municipio de Chía, donde funciona la planta de Parmalat Ltda., el municipio de Cajicá y, por último, la Universidad Militar Nueva Granada. Los mapas permiten ver con claridad el contexto del estudio."},{"t":"h","l":3,"h":"7.1.1. Ubicación Geográfica de Colombia en el Mundo","x":"7.1.1. Ubicación Geográfica de Colombia en el Mundo"},{"t":"p","h":"<strong>Figura 1<\/strong>","x":"Figura 1"},{"t":"p","h":"<em>Ubicación de Colombia en el mundo<\/em>","x":"Ubicación de Colombia en el mundo"},{"t":"img","src":"rId9"},{"t":"p","h":"<strong><em>Nota. <\/em><\/strong>Tomado de Mapa de Colombia, mapa geográfico de Colombia con el mapamundi resaltado , por iStock, 2024.","x":"Nota. Tomado de Mapa de Colombia, mapa geográfico de Colombia con el mapamundi resaltado , por iStock, 2024."},{"t":"p","h":"Como se observa en la Figura 1, Colombia se encuentra en el noroccidente de América del Sur. El país limita con Venezuela y Brasil al oriente, con Perú y Ecuador al sur y con Panamá al noroccidente, y cuenta con costas sobre el mar Caribe y el océano Pacífico, lo que le da una posición estratégica para el comercio internacional. Esta ubicación facilita la conexión de sus industrias con otros mercados.","x":"Como se observa en la Figura 1, Colombia se encuentra en el noroccidente de América del Sur. El país limita con Venezuela y Brasil al oriente, con Perú y Ecuador al sur y con Panamá al noroccidente, y cuenta con costas sobre el mar Caribe y el océano Pacífico, lo que le da una posición estratégica para el comercio internacional. Esta ubicación facilita la conexión de sus industrias con otros mercados."},{"t":"h","l":3,"h":"7.1.2. El Mapa Político de Colombia","x":"7.1.2. El Mapa Político de Colombia"},{"t":"p","h":"<strong>Figura 2<\/strong>","x":"Figura 2"},{"t":"p","h":"<em>Mapa político de Colombia<\/em>","x":"Mapa político de Colombia"},{"t":"img","src":"rId10"},{"t":"p","h":"<strong><em>Nota. <\/em><\/strong>Tomado de Mapa de la división política de Colombia , por Blogspot, 2012.","x":"Nota. Tomado de Mapa de la división política de Colombia , por Blogspot, 2012."},{"t":"p","h":"La República de Colombia se encuentra ubicada en el extremo noroccidental de América del Sur. Su territorio continental se extiende aproximadamente entre los 4° 13′ 30″ de latitud sur y los 12° 30′ 40″ de latitud norte, y entre los 66° 50′ 54″ y los 79° 01′ 23″ de longitud oeste. Debido a esta posición, Colombia se encuentra principalmente en el hemisferio norte y completamente al oeste del meridiano de Greenwich. Estas coordenadas permiten establecer su posición geográfica con respecto al ecuador terrestre y al meridiano de referencia.","x":"La República de Colombia se encuentra ubicada en el extremo noroccidental de América del Sur. Su territorio continental se extiende aproximadamente entre los 4° 13′ 30″ de latitud sur y los 12° 30′ 40″ de latitud norte, y entre los 66° 50′ 54″ y los 79° 01′ 23″ de longitud oeste. Debido a esta posición, Colombia se encuentra principalmente en el hemisferio norte y completamente al oeste del meridiano de Greenwich. Estas coordenadas permiten establecer su posición geográfica con respecto al ecuador terrestre y al meridiano de referencia."},{"t":"h","l":3,"h":"7.1.3. Municipio de Chía, Cundinamarca","x":"7.1.3. Municipio de Chía, Cundinamarca"},{"t":"p","h":"<strong>Figura 3<\/strong>","x":"Figura 3"},{"t":"p","h":"<em>Ubicación del municipio de Chía en el departamento de Cundinamarca<\/em>","x":"Ubicación del municipio de Chía en el departamento de Cundinamarca"},{"t":"tbl","rows":[["<img data-r=\"rId11\" alt=\"Imagen del documento\">"]],"x":""},{"t":"p","h":"<em>Nota. <\/em>Tomado de Mapa de Cundinamarca, Division de Departamentos","x":"Nota. Tomado de Mapa de Cundinamarca, Division de Departamentos"},{"t":"p","h":"El departamento de Cundinamarca está situado en la región Andina, en el centro de Colombia. Su ubicación astronómica se encuentra aproximadamente entre los 3° 40′ 14″ y los 5° 50′ 11″ de latitud norte, y entre los 73° 03′ 08″ y los 74° 53′ 35″ de longitud oeste. Esta localización permite identificar su posición dentro del territorio colombiano y reconocer su importancia geográfica en la región central del país.","x":"El departamento de Cundinamarca está situado en la región Andina, en el centro de Colombia. Su ubicación astronómica se encuentra aproximadamente entre los 3° 40′ 14″ y los 5° 50′ 11″ de latitud norte, y entre los 73° 03′ 08″ y los 74° 53′ 35″ de longitud oeste. Esta localización permite identificar su posición dentro del territorio colombiano y reconocer su importancia geográfica en la región central del país."},{"t":"h","l":3,"h":"7.1.4. Mapa de Cajicá","x":"7.1.4. Mapa de Cajicá"},{"t":"p","h":"<strong>Figura 4<\/strong>","x":"Figura 4"},{"t":"p","h":"<em>Mapa geográfico de Cajicá<\/em>","x":"Mapa geográfico de Cajicá"},{"t":"img","src":"rId12"},{"t":"p","h":"<strong>Nota<\/strong>. Tomado de mapa de Cajicá, por SlideShare, s.f.","x":"Nota. Tomado de mapa de Cajicá, por SlideShare, s.f."},{"t":"p","h":"Cajicá es un municipio del departamento de Cundinamarca, ubicado en la provincia de Sabana Centro, al norte de Bogotá. La cabecera municipal se localiza aproximadamente en los 4° 55′ 02″ de latitud norte y los 74° 01′ 32″ de longitud oeste. Estas coordenadas representan un punto de referencia del centro urbano y permiten establecer su posición geográfica dentro del departamento de Cundinamarca.","x":"Cajicá es un municipio del departamento de Cundinamarca, ubicado en la provincia de Sabana Centro, al norte de Bogotá. La cabecera municipal se localiza aproximadamente en los 4° 55′ 02″ de latitud norte y los 74° 01′ 32″ de longitud oeste. Estas coordenadas representan un punto de referencia del centro urbano y permiten establecer su posición geográfica dentro del departamento de Cundinamarca."},{"t":"h","l":3,"h":"7.1.5. Mapa de la Universidad Militar Nueva Granada","x":"7.1.5. Mapa de la Universidad Militar Nueva Granada"},{"t":"p","h":"<strong>Figura 5<\/strong>","x":"Figura 5"},{"t":"img","src":"rId13"},{"t":"p","h":"<strong><em>Nota<\/em><\/strong>. Tomado de Mapa de la Universidad Militar Nueva Granada, por ResearchGate, 2022.","x":"Nota. Tomado de Mapa de la Universidad Militar Nueva Granada, por ResearchGate, 2022."},{"t":"p","h":"<em>Universidad Militar Nueva Granada, Campus Cajicá<\/em>","x":"Universidad Militar Nueva Granada, Campus Cajicá"},{"t":"p","h":"La Universidad Militar Nueva Granada, en su Campus Nueva Granada, se encuentra en el municipio de Cajicá, departamento de Cundinamarca, Colombia, sobre la vía Cajicá-Zipaquirá. Su ubicación geográfica aproximada corresponde a los 4° 56′ 32″ de latitud norte y los 74° 00′ 42″ de longitud oeste. Estas coordenadas permiten identificar la posición del campus dentro del municipio. Se debe tener en cuenta que pueden existir pequeñas variaciones según el punto específico del campus que se utilice como referencia.","x":"La Universidad Militar Nueva Granada, en su Campus Nueva Granada, se encuentra en el municipio de Cajicá, departamento de Cundinamarca, Colombia, sobre la vía Cajicá-Zipaquirá. Su ubicación geográfica aproximada corresponde a los 4° 56′ 32″ de latitud norte y los 74° 00′ 42″ de longitud oeste. Estas coordenadas permiten identificar la posición del campus dentro del municipio. Se debe tener en cuenta que pueden existir pequeñas variaciones según el punto específico del campus que se utilice como referencia."},{"t":"p","h":"Referencias","x":"Referencias"},{"t":"p","h":"Alcaldía Municipal de Cajicá. (s. f.). Sitio oficial de la Alcaldía Municipal de Cajicá. <a href=\"https://cajica.gov.co/\" target=\"_blank\" rel=\"noopener\">https://cajica.gov.co/<\/a>","x":"Alcaldía Municipal de Cajicá. (s. f.). Sitio oficial de la Alcaldía Municipal de Cajicá. https://cajica.gov.co/"},{"t":"p","h":"Gobernación de Cundinamarca. (s. f.). Gobernación de Cundinamarca. <a href=\"https://www.cundinamarca.gov.co/\" target=\"_blank\" rel=\"noopener\">https://www.cundinamarca.gov.co/<\/a>","x":"Gobernación de Cundinamarca. (s. f.). Gobernación de Cundinamarca. https://www.cundinamarca.gov.co/"},{"t":"p","h":"Instituto Geográfico Agustín Codazzi. (s. f.). Colombia en mapas. <a href=\"https://www.igac.gov.co/\" target=\"_blank\" rel=\"noopener\">https://www.igac.gov.co/<\/a>","x":"Instituto Geográfico Agustín Codazzi. (s. f.). Colombia en mapas. https://www.igac.gov.co/"},{"t":"p","h":"Universidad Militar Nueva Granada. (s. f.). Universidad Militar Nueva Granada. <a href=\"https://www.umng.edu.co/\" target=\"_blank\" rel=\"noopener\">https://www.umng.edu.co/<\/a>","x":"Universidad Militar Nueva Granada. (s. f.). Universidad Militar Nueva Granada. https://www.umng.edu.co/"},{"t":"h","l":2,"h":"7.2. Marco Histórico","x":"7.2. Marco Histórico"},{"t":"p","h":"El marco histórico de este proyecto sigue dos hilos: el desarrollo de Lean Manufacturing y la presencia de Parmalat en Colombia. En primer lugar se describe, en orden cronológico, cómo la manufactura evolucionó de la producción en masa hacia la gestión esbelta; luego se presentan los hechos que explican cómo se consolidó la empresa y su planta de Chía en el país. Cada hecho se acompaña de una figura.","x":"El marco histórico de este proyecto sigue dos hilos: el desarrollo de Lean Manufacturing y la presencia de Parmalat en Colombia. En primer lugar se describe, en orden cronológico, cómo la manufactura evolucionó de la producción en masa hacia la gestión esbelta; luego se presentan los hechos que explican cómo se consolidó la empresa y su planta de Chía en el país. Cada hecho se acompaña de una figura."},{"t":"h","l":3,"h":"7.2.1. Evolución de Lean Manufacturing","x":"7.2.1. Evolución de Lean Manufacturing"},{"t":"h","l":4,"h":"7.2.1.1. (1913) La línea de ensamble móvil de Ford","x":"7.2.1.1. (1913) La línea de ensamble móvil de Ford"},{"t":"p","h":"<strong>Figura 6<\/strong>","x":"Figura 6"},{"t":"p","h":"<em>Línea de ensamble móvil de Ford en 1913<\/em>","x":"Línea de ensamble móvil de Ford en 1913"},{"t":"img","src":"rId14"},{"t":"p","h":"<strong><em>Nota<\/em><\/strong>. Tomado de línea de ensamblaje móvil de Ford en 1913","x":"Nota. Tomado de línea de ensamblaje móvil de Ford en 1913"},{"t":"p","h":"En 1913 Henry Ford introdujo la línea de ensamble móvil en su planta de Highland Park para fabricar el Modelo T. Esta innovación redujo de forma notable el tiempo de fabricación de cada vehículo y dio origen a la producción en masa, un sistema muy eficiente en volumen pero rígido ante la variedad de productos, como describen Womack et al. (1990). Este modelo marcó el punto de partida de la manufactura moderna.","x":"En 1913 Henry Ford introdujo la línea de ensamble móvil en su planta de Highland Park para fabricar el Modelo T. Esta innovación redujo de forma notable el tiempo de fabricación de cada vehículo y dio origen a la producción en masa, un sistema muy eficiente en volumen pero rígido ante la variedad de productos, como describen Womack et al. (1990). Este modelo marcó el punto de partida de la manufactura moderna."},{"t":"h","l":4,"h":"7.2.1.2. (Finales de la década de 1940) El Sistema de Producción Toyota","x":"7.2.1.2. (Finales de la década de 1940) El Sistema de Producción Toyota"},{"t":"p","h":"<strong>Figura 7<\/strong>","x":"Figura 7"},{"t":"p","h":"<em>Sistema de Producción Toyota<\/em>","x":"Sistema de Producción Toyota"},{"t":"img","src":"rId15"},{"t":"p","h":"Nota. Adaptado de archivos históricos de dominio público de Toyota Motor Corporation.","x":"Nota. Adaptado de archivos históricos de dominio público de Toyota Motor Corporation."},{"t":"p","h":"<a href=\"https://www.lanacion.com.ar/autos/toyota-cerro-su-planta-mas-antigua-fuera-de-japon-que-hay-detras-de-la-decision-nid26012024/\" target=\"_blank\" rel=\"noopener\">https://www.lanacion.com.ar/autos/toyota-cerro-su-planta-mas-antigua-fuera-de-japon-que-hay-detras-de-la-decision-nid26012024/<\/a>","x":"https://www.lanacion.com.ar/autos/toyota-cerro-su-planta-mas-antigua-fuera-de-japon-que-hay-detras-de-la-decision-nid26012024/"},{"t":"p","h":"Tras la Segunda Guerra Mundial, Toyota enfrentó escasez de recursos y una demanda reducida y variada. En ese contexto, Taiichi Ohno desarrolló el Sistema de Producción Toyota, centrado en eliminar los desperdicios y producir solo lo necesario (Ohno, 1988). Este sistema es la base de lo que hoy se conoce como Lean Manufacturing. Su aporte principal fue mostrar que reducir pérdidas mejora la calidad y la productividad.","x":"Tras la Segunda Guerra Mundial, Toyota enfrentó escasez de recursos y una demanda reducida y variada. En ese contexto, Taiichi Ohno desarrolló el Sistema de Producción Toyota, centrado en eliminar los desperdicios y producir solo lo necesario (Ohno, 1988). Este sistema es la base de lo que hoy se conoce como Lean Manufacturing. Su aporte principal fue mostrar que reducir pérdidas mejora la calidad y la productividad."},{"t":"h","l":4,"h":"7.2.1.3. (1990) La producción esbelta se populariza","x":"7.2.1.3. (1990) La producción esbelta se populariza"},{"t":"p","h":"<strong>Figura 8<\/strong>","x":"Figura 8"},{"t":"p","h":"<em>Portada del libro <\/em><em>The<\/em><em> Machine <\/em><em>That<\/em><em> <\/em><em>Changed<\/em><em> <\/em><em>the<\/em><em> <\/em><em>World<\/em>","x":"Portada del libro The Machine That Changed the World"},{"t":"img","src":"rId17"},{"t":"p","h":"<strong><em>Nota<\/em><\/strong>. Tomado the machine that changed the world (2016) <a href=\"https://www.bol.com/nl/nl/f/the-machine-that-changed-the-world/39101843/\" target=\"_blank\" rel=\"noopener\">https://www.bol.com/nl/nl/f/the-machine-that-changed-the-world/39101843/<\/a>","x":"Nota. Tomado the machine that changed the world (2016) https://www.bol.com/nl/nl/f/the-machine-that-changed-the-world/39101843/"},{"t":"p","h":"En 1990, Womack, Jones y Roos publicaron el libro The Machine That Changed the World, resultado de un estudio internacional de la industria automotriz. En él se difundió el término producción esbelta para describir las prácticas de Toyota y se mostró su ventaja frente a la producción en masa occidental (Womack et al., 1990). Con ello el concepto lean salió de Japón y llegó a las empresas de todo el mundo.","x":"En 1990, Womack, Jones y Roos publicaron el libro The Machine That Changed the World, resultado de un estudio internacional de la industria automotriz. En él se difundió el término producción esbelta para describir las prácticas de Toyota y se mostró su ventaja frente a la producción en masa occidental (Womack et al., 1990). Con ello el concepto lean salió de Japón y llegó a las empresas de todo el mundo."},{"t":"h","l":4,"h":"7.2.1.4. (1996) Los cinco principios de Lean Thinking","x":"7.2.1.4. (1996) Los cinco principios de Lean Thinking"},{"t":"p","h":"<strong>Figura 9<\/strong>","x":"Figura 9"},{"t":"p","h":"<em>Portada del libro Lean <\/em><em>Thinking<\/em>","x":"Portada del libro Lean Thinking"},{"t":"img","src":"rId19"},{"t":"p","h":"<strong><em>Nota<\/em><\/strong>. Tomado de Lean thinking (2025)","x":"Nota. Tomado de Lean thinking (2025)"},{"t":"p","h":"<a href=\"https://shop.leaninstituut.nl/products/lean-thinking-nl\" target=\"_blank\" rel=\"noopener\">https://shop.leaninstituut.nl/products/lean-thinking-nl<\/a>","x":"https://shop.leaninstituut.nl/products/lean-thinking-nl"},{"t":"p","h":"En 1996, Womack y Jones publicaron Lean Thinking, donde sintetizaron la filosofía esbelta en cinco principios: valor, cadena de valor, flujo, producción tirada por la demanda y perfección. A partir de entonces, Lean se extendió de la industria automotriz a otros sectores productivos (Womack y Jones, 1996). Estos principios guían el diagnóstico y las mejoras que propone este proyecto para la línea.","x":"En 1996, Womack y Jones publicaron Lean Thinking, donde sintetizaron la filosofía esbelta en cinco principios: valor, cadena de valor, flujo, producción tirada por la demanda y perfección. A partir de entonces, Lean se extendió de la industria automotriz a otros sectores productivos (Womack y Jones, 1996). Estos principios guían el diagnóstico y las mejoras que propone este proyecto para la línea."},{"t":"h","l":4,"h":"7.2.2.1. (1995) Parmalat llega a Colombia","x":"7.2.2.1. (1995) Parmalat llega a Colombia"},{"t":"p","h":"<strong>Figura 10<\/strong>","x":"Figura 10"},{"t":"p","h":"<em>Parmalat en Colombia<\/em>","x":"Parmalat en Colombia"},{"t":"img","src":"rId21"},{"t":"p","h":"<strong><em>Nota<\/em><\/strong>. Tomado de planta de Lima/Perú (2020) <a href=\"https://m.elcolombiano.com/negocios/grupo-gloria-lechesan-algarra-leche-cierra-LE34650946\" target=\"_blank\" rel=\"noopener\">https://m.elcolombiano.com/negocios/grupo-gloria-lechesan-algarra-leche-cierra-LE34650946<\/a>","x":"Nota. Tomado de planta de Lima/Perú (2020) https://m.elcolombiano.com/negocios/grupo-gloria-lechesan-algarra-leche-cierra-LE34650946"},{"t":"p","h":"Parmalat llegó a Colombia en 1995 y desde entonces se consolidó en el mercado de lácteos del país (Redacción Portafolio, 2014). La compañía opera en el municipio de Chía una planta donde se procesan derivados lácteos, entre ellos el yogurt, producto cuya línea de embotellamiento es el objeto de esta investigación. Desde entonces la empresa ha buscado fortalecer su producción local para competir con otras marcas del sector.","x":"Parmalat llegó a Colombia en 1995 y desde entonces se consolidó en el mercado de lácteos del país (Redacción Portafolio, 2014). La compañía opera en el municipio de Chía una planta donde se procesan derivados lácteos, entre ellos el yogurt, producto cuya línea de embotellamiento es el objeto de esta investigación. Desde entonces la empresa ha buscado fortalecer su producción local para competir con otras marcas del sector."},{"t":"h","l":4,"h":"7.2.2.2. (2003) Plan de mejoramiento en la planta de Chía","x":"7.2.2.2. (2003) Plan de mejoramiento en la planta de Chía"},{"t":"p","h":"<strong>Figura 11<\/strong>","x":"Figura 11"},{"t":"p","h":"<em>Planta de Parmalat Colombia en Chía<\/em>","x":"Planta de Parmalat Colombia en Chía"},{"t":"img","src":"rId23"},{"t":"p","h":"Nota. Tomado de, planta chía Cundinamarca (2014)  <a href=\"https://www.revistainforetail.com/noticiadet/parmalat-avanza-en-america/696a2e918c16f4ecee5ace504a36fe9c\" target=\"_blank\" rel=\"noopener\">https://www.revistainforetail.com/noticiadet/parmalat-avanza-en-america/696a2e918c16f4ecee5ace504a36fe9c<\/a>","x":"Nota. Tomado de, planta chía Cundinamarca (2014)  https://www.revistainforetail.com/noticiadet/parmalat-avanza-en-america/696a2e918c16f4ecee5ace504a36fe9c"},{"t":"p","h":"En 2003, Cabrera Narváez y Castaño Garzón elaboraron un plan de mejoramiento del proceso productivo de la planta de Parmalat en Chía, en el que identificaron pérdidas de producto asociadas a los lavados y empujes del proceso (Cabrera Narváez y Castaño Garzón, 2003). Este trabajo confirma que la eficiencia de la planta ha sido objeto de estudio académico. Además, sus resultados sirven como punto de comparación para la propuesta actual.","x":"En 2003, Cabrera Narváez y Castaño Garzón elaboraron un plan de mejoramiento del proceso productivo de la planta de Parmalat en Chía, en el que identificaron pérdidas de producto asociadas a los lavados y empujes del proceso (Cabrera Narváez y Castaño Garzón, 2003). Este trabajo confirma que la eficiencia de la planta ha sido objeto de estudio académico. Además, sus resultados sirven como punto de comparación para la propuesta actual."},{"t":"h","l":2,"h":"7.3. Marco de Antecedentes","x":"7.3. Marco de Antecedentes"},{"t":"p","h":"A continuación se presentan dos investigaciones que sirven de antecedente a este trabajo: una internacional, realizada en una planta de yogurt de Ecuador, y una nacional, desarrollada en la misma planta de Parmalat en Chía. De cada una se indican su título, autor, año y lugar de publicación, y se explican su objetivo, su metodología, sus resultados y su relación con la presente investigación.","x":"A continuación se presentan dos investigaciones que sirven de antecedente a este trabajo: una internacional, realizada en una planta de yogurt de Ecuador, y una nacional, desarrollada en la misma planta de Parmalat en Chía. De cada una se indican su título, autor, año y lugar de publicación, y se explican su objetivo, su metodología, sus resultados y su relación con la presente investigación."},{"t":"p","h":"<strong>Título: <\/strong><em>Optimización de los tiempos de operación del área de envasado de yogurt en Industrias Lácteas Toni S.A.<\/em>","x":"Título: Optimización de los tiempos de operación del área de envasado de yogurt en Industrias Lácteas Toni S.A."},{"t":"p","h":"<strong>Autor: <\/strong>Genaro Alfredo Vinueza Párraga","x":"Autor: Genaro Alfredo Vinueza Párraga"},{"t":"p","h":"<strong>Año y lugar de publicación: <\/strong>Ecuador, 2018","x":"Año y lugar de publicación: Ecuador, 2018"},{"t":"p","h":"Vinueza Párraga (2018) buscó optimizar los tiempos de operación del área de envasado de yogurt de Industrias Lácteas Toni S.A., en Guayaquil, Ecuador, enfocándose en los cambios de formato entre presentaciones. El problema que motivó el estudio eran los atascos por calibración incorrecta de la máquina y cambios de formato que tardaban, en promedio, unas dos horas y media por cada cambio realizado.","x":"Vinueza Párraga (2018) buscó optimizar los tiempos de operación del área de envasado de yogurt de Industrias Lácteas Toni S.A., en Guayaquil, Ecuador, enfocándose en los cambios de formato entre presentaciones. El problema que motivó el estudio eran los atascos por calibración incorrecta de la máquina y cambios de formato que tardaban, en promedio, unas dos horas y media por cada cambio realizado."},{"t":"p","h":"Para ello realizó un estudio de tiempos y movimientos con cronometraje y videograbación, elaboró diagramas de flujo y un diagrama de Ishikawa para hallar las causas de las demoras, y aplicó las herramientas SMED y 5S para estandarizar y reducir las actividades del cambio de formato en la línea de envasado. Estas herramientas se aplicaron de manera combinada para atacar tanto las demoras como los desajustes de la máquina.","x":"Para ello realizó un estudio de tiempos y movimientos con cronometraje y videograbación, elaboró diagramas de flujo y un diagrama de Ishikawa para hallar las causas de las demoras, y aplicó las herramientas SMED y 5S para estandarizar y reducir las actividades del cambio de formato en la línea de envasado. Estas herramientas se aplicaron de manera combinada para atacar tanto las demoras como los desajustes de la máquina."},{"t":"p","h":"Con estas herramientas se redujo, en promedio, a la mitad el tiempo de los cambios de formato. Este antecedente se relaciona con la presente investigación porque aborda el mismo producto, la misma etapa del proceso y los mismos problemas de calibración y cambio de formato que se presentan en la línea de embotellamiento de Parmalat. Esto confirma que la técnica es viable en el sector lácteo y en la presentación estudiada por el equipo.","x":"Con estas herramientas se redujo, en promedio, a la mitad el tiempo de los cambios de formato. Este antecedente se relaciona con la presente investigación porque aborda el mismo producto, la misma etapa del proceso y los mismos problemas de calibración y cambio de formato que se presentan en la línea de embotellamiento de Parmalat. Esto confirma que la técnica es viable en el sector lácteo y en la presentación estudiada por el equipo."},{"t":"p","h":"<strong>Título: <\/strong><em>Plan de mejoramiento del proceso productivo de Parmalat Colombia Ltda. <\/em><em>planta<\/em><em> Chía<\/em>","x":"Título: Plan de mejoramiento del proceso productivo de Parmalat Colombia Ltda. planta Chía"},{"t":"p","h":"<strong>Autores: <\/strong>Narváez y Castaño Garzón","x":"Autores: Narváez y Castaño Garzón"},{"t":"p","h":"<strong>Año y lugar de publicación: <\/strong>Colombia, 2003","x":"Año y lugar de publicación: Colombia, 2003"},{"t":"p","h":"Cabrera Narváez y Castaño Garzón (2003) elaboraron, en la Universidad Nacional de Colombia, sede Manizales, un plan de mejoramiento del proceso productivo de Parmalat Colombia Ltda. en su planta de Chía. Su objetivo fue identificar las pérdidas del proceso y proponer acciones concretas que permitieran reducirlas y mejorar la eficiencia de la planta. Esto permite conocer cómo funcionaba la línea.","x":"Cabrera Narváez y Castaño Garzón (2003) elaboraron, en la Universidad Nacional de Colombia, sede Manizales, un plan de mejoramiento del proceso productivo de Parmalat Colombia Ltda. en su planta de Chía. Su objetivo fue identificar las pérdidas del proceso y proponer acciones concretas que permitieran reducirlas y mejorar la eficiencia de la planta. Esto permite conocer cómo funcionaba la línea."},{"t":"p","h":"Entre sus hallazgos, los autores estimaron que cerca del 15,6 % de la producción inicial se perdía en los lavados y empujes del proceso. Entre las mejoras propuestas señalaron el uso de nitrógeno para impulsar el producto, con el cual la pérdida asociada se redujo en cerca de un 95 %, lo que evidencia el potencial de mejora de la planta. Esto confirma que existen oportunidades concretas de optimización en la planta.","x":"Entre sus hallazgos, los autores estimaron que cerca del 15,6 % de la producción inicial se perdía en los lavados y empujes del proceso. Entre las mejoras propuestas señalaron el uso de nitrógeno para impulsar el producto, con el cual la pérdida asociada se redujo en cerca de un 95 %, lo que evidencia el potencial de mejora de la planta. Esto confirma que existen oportunidades concretas de optimización en la planta."},{"t":"p","h":"Este antecedente se relaciona con la presente investigación porque se desarrolló en la misma planta de Parmalat en Chía y demuestra que las pérdidas de producto y la eficiencia del proceso son problemas reconocidos allí. A diferencia de aquel trabajo, este se enfoca en la línea de embotellamiento de yogurt tamaño familiar y en el uso de Lean Manufacturing. Esto permite complementar la información histórica con un enfoque actual de mejora continua.","x":"Este antecedente se relaciona con la presente investigación porque se desarrolló en la misma planta de Parmalat en Chía y demuestra que las pérdidas de producto y la eficiencia del proceso son problemas reconocidos allí. A diferencia de aquel trabajo, este se enfoca en la línea de embotellamiento de yogurt tamaño familiar y en el uso de Lean Manufacturing. Esto permite complementar la información histórica con un enfoque actual de mejora continua."},{"t":"h","l":2,"h":"7.4. Marco Conceptual","x":"7.4. Marco Conceptual"},{"t":"p","h":"Para comprender mejor el tema de estudio, es fundamental dejar claros algunos términos y conceptos básicos sobre la optimización de procesos mediante Lean Manufacturing. Los términos se presentan en orden alfabético y cada definición se apoya en un autor. Los conceptos corresponden a las herramientas de Lean, a los indicadores de desempeño de los equipos y a los problemas operativos de la línea de embotellamiento.","x":"Para comprender mejor el tema de estudio, es fundamental dejar claros algunos términos y conceptos básicos sobre la optimización de procesos mediante Lean Manufacturing. Los términos se presentan en orden alfabético y cada definición se apoya en un autor. Los conceptos corresponden a las herramientas de Lean, a los indicadores de desempeño de los equipos y a los problemas operativos de la línea de embotellamiento."},{"t":"h","l":3,"h":"7.4.1. Cambio de Formato","x":"7.4.1. Cambio de Formato"},{"t":"p","h":"Es el procedimiento mediante el cual una línea de envasado se ajusta, se limpia y se calibra para pasar de una presentación de producto a otra. Durante ese tiempo la máquina no produce, por lo que su duración afecta directamente la disponibilidad del equipo (Vinueza Párraga, 2018). Por eso reducirlo es una oportunidad clara de mejora de la línea de yogurt tamaño familiar de la planta.","x":"Es el procedimiento mediante el cual una línea de envasado se ajusta, se limpia y se calibra para pasar de una presentación de producto a otra. Durante ese tiempo la máquina no produce, por lo que su duración afecta directamente la disponibilidad del equipo (Vinueza Párraga, 2018). Por eso reducirlo es una oportunidad clara de mejora de la línea de yogurt tamaño familiar de la planta."},{"t":"h","l":3,"h":"7.4.2. Desperdicio (Muda)","x":"7.4.2. Desperdicio (Muda)"},{"t":"p","h":"Es toda actividad que consume recursos y no agrega valor para el cliente. Ohno (1988) identificó siete tipos en el sistema Toyota: sobreproducción, esperas, transporte, sobreprocesamiento, inventario, movimientos innecesarios y defectos, y propuso su eliminación sistemática como base de la mejora continua. En este proyecto, el término se usa para identificar las pérdidas de tiempo y de producto en la línea.","x":"Es toda actividad que consume recursos y no agrega valor para el cliente. Ohno (1988) identificó siete tipos en el sistema Toyota: sobreproducción, esperas, transporte, sobreprocesamiento, inventario, movimientos innecesarios y defectos, y propuso su eliminación sistemática como base de la mejora continua. En este proyecto, el término se usa para identificar las pérdidas de tiempo y de producto en la línea."},{"t":"h","l":3,"h":"7.4.3. Efectividad Global de los Equipos (OEE)","x":"7.4.3. Efectividad Global de los Equipos (OEE)"},{"t":"p","h":"Indicador que mide qué tan bien se aprovecha un equipo y que resulta del producto de tres factores: la disponibilidad, que es la fracción del tiempo planificado en que el equipo funciona; el rendimiento, que compara su velocidad real con la teórica; y la calidad, que es la proporción de unidades conformes (Nakajima, 1988). Es el indicador que se calcula en la línea al inicio y al final de la propuesta de optimización.","x":"Indicador que mide qué tan bien se aprovecha un equipo y que resulta del producto de tres factores: la disponibilidad, que es la fracción del tiempo planificado en que el equipo funciona; el rendimiento, que compara su velocidad real con la teórica; y la calidad, que es la proporción de unidades conformes (Nakajima, 1988). Es el indicador que se calcula en la línea al inicio y al final de la propuesta de optimización."},{"t":"h","l":3,"h":"7.4.4. Lean Manufacturing","x":"7.4.4. Lean Manufacturing"},{"t":"p","h":"Es un modelo de gestión de la producción, derivado del Sistema de Producción Toyota, que busca eliminar los desperdicios y generar más valor con menos recursos. Se apoya en técnicas como el VSM, el SMED y el TPM, orientadas a la mejora continua de los procesos (Hernández Matías y Vizán Idoipe, 2013). En este proyecto se aplica a la línea de embotellamiento de yogurt de la planta.","x":"Es un modelo de gestión de la producción, derivado del Sistema de Producción Toyota, que busca eliminar los desperdicios y generar más valor con menos recursos. Se apoya en técnicas como el VSM, el SMED y el TPM, orientadas a la mejora continua de los procesos (Hernández Matías y Vizán Idoipe, 2013). En este proyecto se aplica a la línea de embotellamiento de yogurt de la planta."},{"t":"h","l":3,"h":"7.4.5. Mantenimiento Productivo Total (TPM)","x":"7.4.5. Mantenimiento Productivo Total (TPM)"},{"t":"p","h":"Enfoque de gestión que busca maximizar la efectividad de los equipos mediante la participación de todos los trabajadores. Combina el mantenimiento preventivo con el mantenimiento autónomo, en el que los propios operarios inspeccionan y cuidan sus máquinas para evitar fallas y paradas no programadas (Nakajima, 1988). Esta herramienta atiende las fallas de las boquillas de la línea.","x":"Enfoque de gestión que busca maximizar la efectividad de los equipos mediante la participación de todos los trabajadores. Combina el mantenimiento preventivo con el mantenimiento autónomo, en el que los propios operarios inspeccionan y cuidan sus máquinas para evitar fallas y paradas no programadas (Nakajima, 1988). Esta herramienta atiende las fallas de las boquillas de la línea."},{"t":"h","l":3,"h":"7.4.6. Mapeo del Flujo de Valor (VSM)","x":"7.4.6. Mapeo del Flujo de Valor (VSM)"},{"t":"p","h":"Herramienta gráfica que representa los pasos y los flujos de material y de información que un producto sigue desde la materia prima hasta el cliente. Permite visualizar los desperdicios del proceso y definir un estado futuro mejorado (Rother y Shook, 1999). Será la herramienta con la que se diagnostique el estado actual de la línea y se proponga su estado futuro. Por eso es la base del diagnóstico del estado actual del proceso en este proyecto.","x":"Herramienta gráfica que representa los pasos y los flujos de material y de información que un producto sigue desde la materia prima hasta el cliente. Permite visualizar los desperdicios del proceso y definir un estado futuro mejorado (Rother y Shook, 1999). Será la herramienta con la que se diagnostique el estado actual de la línea y se proponga su estado futuro. Por eso es la base del diagnóstico del estado actual del proceso en este proyecto."},{"t":"h","l":3,"h":"7.4.7. SMED","x":"7.4.7. SMED"},{"t":"p","h":"Sistema desarrollado por Shingo para reducir los tiempos de preparación y cambio en las máquinas. Su principio es separar las actividades que se hacen con el equipo detenido (internas) de las que pueden hacerse con el equipo en marcha (externas) y convertir las primeras en segundas (Shingo, 1985). Se aplicará a los cambios de formato de la línea de embotellamiento de yogurt de la planta, donde son más largos.","x":"Sistema desarrollado por Shingo para reducir los tiempos de preparación y cambio en las máquinas. Su principio es separar las actividades que se hacen con el equipo detenido (internas) de las que pueden hacerse con el equipo en marcha (externas) y convertir las primeras en segundas (Shingo, 1985). Se aplicará a los cambios de formato de la línea de embotellamiento de yogurt de la planta, donde son más largos."},{"t":"h","l":2,"h":"7.5. Marco Legal","x":"7.5. Marco Legal"},{"t":"p","h":"En este apartado se relacionan las normas jurídicas que sustentan el procesamiento y el envase del yogurt y la intervención de la línea de embotellamiento. Se presentan, en orden cronológico, las normas sanitarias que regulan los alimentos y los derivados lácteos, las buenas prácticas de manufactura que debe cumplir toda planta de alimentos y la norma de seguridad laboral aplicable a la operación y el mantenimiento de las máquinas.","x":"En este apartado se relacionan las normas jurídicas que sustentan el procesamiento y el envase del yogurt y la intervención de la línea de embotellamiento. Se presentan, en orden cronológico, las normas sanitarias que regulan los alimentos y los derivados lácteos, las buenas prácticas de manufactura que debe cumplir toda planta de alimentos y la norma de seguridad laboral aplicable a la operación y el mantenimiento de las máquinas."},{"t":"h","l":3,"h":"7.5.1. Ley 9 de 1979","x":"7.5.1. Ley 9 de 1979"},{"t":"p","h":"La Ley 9 de 1979, conocida como Código Sanitario Nacional, dictó medidas sanitarias para proteger la salud humana y reguló aspectos como la salud ocupacional, los alimentos y el saneamiento ambiental (Congreso de la República de Colombia, 1979). Para este proyecto es relevante porque establece las condiciones generales de higiene que deben cumplir las plantas donde se procesan alimentos, como la planta de Parmalat en Chía.","x":"La Ley 9 de 1979, conocida como Código Sanitario Nacional, dictó medidas sanitarias para proteger la salud humana y reguló aspectos como la salud ocupacional, los alimentos y el saneamiento ambiental (Congreso de la República de Colombia, 1979). Para este proyecto es relevante porque establece las condiciones generales de higiene que deben cumplir las plantas donde se procesan alimentos, como la planta de Parmalat en Chía."},{"t":"h","l":3,"h":"7.5.2. Resolución 2310 de 1986","x":"7.5.2. Resolución 2310 de 1986"},{"t":"p","h":"La Resolución 2310 de 1986 reglamentó parcialmente el Título V de la Ley 9 de 1979 en lo referente al procesamiento, la composición, los requisitos, el transporte y la venta de los derivados lácteos (Ministerio de Salud, 1986). Es una norma clave para esta investigación, pues el yogurt es un derivado lácteo y su producción y envase deben cumplir los requisitos que ella señala. Por eso es una norma de referencia para el proyecto.","x":"La Resolución 2310 de 1986 reglamentó parcialmente el Título V de la Ley 9 de 1979 en lo referente al procesamiento, la composición, los requisitos, el transporte y la venta de los derivados lácteos (Ministerio de Salud, 1986). Es una norma clave para esta investigación, pues el yogurt es un derivado lácteo y su producción y envase deben cumplir los requisitos que ella señala. Por eso es una norma de referencia para el proyecto."},{"t":"h","l":3,"h":"7.5.3. Decreto 616 de 2006","x":"7.5.3. Decreto 616 de 2006"},{"t":"p","h":"El Decreto 616 de 2006 expidió el reglamento técnico sobre los requisitos que debe cumplir la leche para el consumo humano que se obtenga, procese, envase, transporte, comercialice, expenda, importe o exporte en el país (Ministerio de la Protección Social, 2006). Se relaciona con este proyecto porque la leche es la materia prima del yogurt y sus condiciones sanitarias influyen en el proceso de envasado.","x":"El Decreto 616 de 2006 expidió el reglamento técnico sobre los requisitos que debe cumplir la leche para el consumo humano que se obtenga, procese, envase, transporte, comercialice, expenda, importe o exporte en el país (Ministerio de la Protección Social, 2006). Se relaciona con este proyecto porque la leche es la materia prima del yogurt y sus condiciones sanitarias influyen en el proceso de envasado."},{"t":"h","l":3,"h":"7.5.4. Resolución 2674 de 2013","x":"7.5.4. Resolución 2674 de 2013"},{"t":"p","h":"La Resolución 2674 de 2013 reglamentó los requisitos sanitarios que deben cumplir quienes fabrican, procesan, envasan, almacenan, transportan y distribuyen alimentos, e incluyó las buenas prácticas de manufactura (Ministerio de Salud y Protección Social, 2013). Cualquier cambio que se proponga en la línea, como la estandarización de limpiezas y ajustes, debe respetar estas buenas prácticas.","x":"La Resolución 2674 de 2013 reglamentó los requisitos sanitarios que deben cumplir quienes fabrican, procesan, envasan, almacenan, transportan y distribuyen alimentos, e incluyó las buenas prácticas de manufactura (Ministerio de Salud y Protección Social, 2013). Cualquier cambio que se proponga en la línea, como la estandarización de limpiezas y ajustes, debe respetar estas buenas prácticas."},{"t":"h","l":3,"h":"7.5.5. Ley 1562 de 2012","x":"7.5.5. Ley 1562 de 2012"},{"t":"p","h":"La Ley 1562 de 2012 modificó el Sistema de Riesgos Laborales en Colombia y estableció disposiciones en materia de salud ocupacional (Congreso de la República de Colombia, 2012). Esta ley se aplica a las tareas de operación, limpieza y mantenimiento de la maquinaria de la línea, por lo que las mejoras con SMED y TPM deben diseñarse de forma que protejan la seguridad de los trabajadores.","x":"La Ley 1562 de 2012 modificó el Sistema de Riesgos Laborales en Colombia y estableció disposiciones en materia de salud ocupacional (Congreso de la República de Colombia, 2012). Esta ley se aplica a las tareas de operación, limpieza y mantenimiento de la maquinaria de la línea, por lo que las mejoras con SMED y TPM deben diseñarse de forma que protejan la seguridad de los trabajadores."}]},{"title":"8. Capítulo 1","cat":"Desarrollo","blocks":[{"t":"h","l":1,"h":"8. Capítulo 1","x":"8. Capítulo 1"},{"t":"p","h":"En este capítulo se desarrollará el primer objetivo específico, que consiste en diagnosticar la situación operacional actual del proceso de embotellamiento de yogurt tamaño familiar en Parmalat Ltda., identificando los cuellos de botella, los tiempos muertos y las principales causas de desperdicio. Para ello se organizará la información sobre los conceptos centrales del título y se contrastará con los datos de la entrevista y la encuesta.","x":"En este capítulo se desarrollará el primer objetivo específico, que consiste en diagnosticar la situación operacional actual del proceso de embotellamiento de yogurt tamaño familiar en Parmalat Ltda., identificando los cuellos de botella, los tiempos muertos y las principales causas de desperdicio. Para ello se organizará la información sobre los conceptos centrales del título y se contrastará con los datos de la entrevista y la encuesta."},{"t":"h","l":2,"h":"8.1. Optimización","x":"8.1. Optimización"},{"t":"p","h":"Optimizar un proceso significa mejorarlo para que produzca mejores resultados con los mismos recursos o con menos. Womack y Jones (1996) resumen esta idea en hacer cada vez más con menos esfuerzo, equipo, tiempo y espacio. En este trabajo, optimizar se entiende como el aumento de la eficiencia de la línea de embotellamiento mediante la eliminación sistemática de desperdicios. Este es el sentido en que se usa el término a lo largo del documento.","x":"Optimizar un proceso significa mejorarlo para que produzca mejores resultados con los mismos recursos o con menos. Womack y Jones (1996) resumen esta idea en hacer cada vez más con menos esfuerzo, equipo, tiempo y espacio. En este trabajo, optimizar se entiende como el aumento de la eficiencia de la línea de embotellamiento mediante la eliminación sistemática de desperdicios. Este es el sentido en que se usa el término a lo largo del documento."},{"t":"p","h":"En una línea de envasado, la optimización se mide con indicadores como la Efectividad Global de los Equipos (OEE), que combina la disponibilidad, el rendimiento y la calidad (Nakajima, 1988). Mejorar este indicador implica atacar las causas de las paradas, de los ajustes prolongados y de las mermas, que son los problemas que se plantean en la línea de yogurt tamaño familiar de Parmalat.","x":"En una línea de envasado, la optimización se mide con indicadores como la Efectividad Global de los Equipos (OEE), que combina la disponibilidad, el rendimiento y la calidad (Nakajima, 1988). Mejorar este indicador implica atacar las causas de las paradas, de los ajustes prolongados y de las mermas, que son los problemas que se plantean en la línea de yogurt tamaño familiar de Parmalat."},{"t":"h","l":2,"h":"8.2. Procesos de Embotellamiento","x":"8.2. Procesos de Embotellamiento"},{"t":"p","h":"El embotellamiento, o envasado, es la etapa del proceso en la que el producto ya elaborado se dosifica en su recipiente y se cierra para su distribución. En una planta láctea esta etapa es crítica, porque de ella depende que el producto llegue al consumidor con el volumen correcto y en condiciones sanitarias adecuadas, y porque una falla de la máquina detiene el flujo de toda la línea. Por eso su control es prioritario.","x":"El embotellamiento, o envasado, es la etapa del proceso en la que el producto ya elaborado se dosifica en su recipiente y se cierra para su distribución. En una planta láctea esta etapa es crítica, porque de ella depende que el producto llegue al consumidor con el volumen correcto y en condiciones sanitarias adecuadas, y porque una falla de la máquina detiene el flujo de toda la línea. Por eso su control es prioritario."},{"t":"p","h":"En el yogurt, el envasado exige cambios de formato cuando la línea pasa de una presentación a otra, y cada cambio requiere ajustar, limpiar y calibrar la máquina. Vinueza Párraga (2018) encontró, en una planta de yogurt de Ecuador, que estos cambios tardaban en promedio unas dos horas y media y que los atascos por calibración incorrecta también detenían la línea. Esto reduce la disponibilidad de la línea.","x":"En el yogurt, el envasado exige cambios de formato cuando la línea pasa de una presentación a otra, y cada cambio requiere ajustar, limpiar y calibrar la máquina. Vinueza Párraga (2018) encontró, en una planta de yogurt de Ecuador, que estos cambios tardaban en promedio unas dos horas y media y que los atascos por calibración incorrecta también detenían la línea. Esto reduce la disponibilidad de la línea."},{"t":"p","h":"En 2003, la planta de Parmalat en Chía contaba con tres líneas de producción: leche UHT, leche en polvo y fermentados (Cabrera Narváez y Castaño Garzón, 2003). El yogurt se elabora en la línea de fermentados, cuyo envasado es el objeto de esta investigación y donde, según lo planteado por el equipo, se concentran las fallas de la máquina que se estudian. Esto delimita el alcance del estudio.","x":"En 2003, la planta de Parmalat en Chía contaba con tres líneas de producción: leche UHT, leche en polvo y fermentados (Cabrera Narváez y Castaño Garzón, 2003). El yogurt se elabora en la línea de fermentados, cuyo envasado es el objeto de esta investigación y donde, según lo planteado por el equipo, se concentran las fallas de la máquina que se estudian. Esto delimita el alcance del estudio."},{"t":"h","l":2,"h":"8.3. Lean Manufacturing","x":"8.3. Lean Manufacturing"},{"t":"h","l":3,"h":"8.3.1. Origen, Principios y Desperdicios","x":"8.3.1. Origen, Principios y Desperdicios"},{"t":"p","h":"Lean Manufacturing nació del Sistema de Producción Toyota, que Ohno (1988) construyó sobre dos pilares: producir justo a tiempo, es decir, solo lo necesario y en el momento necesario, y dotar a las máquinas de la capacidad de detectar anomalías y detenerse. Su propósito central es eliminar los desperdicios que encarecen el producto sin aportarle valor al cliente. Esta idea guía todo el proyecto.","x":"Lean Manufacturing nació del Sistema de Producción Toyota, que Ohno (1988) construyó sobre dos pilares: producir justo a tiempo, es decir, solo lo necesario y en el momento necesario, y dotar a las máquinas de la capacidad de detectar anomalías y detenerse. Su propósito central es eliminar los desperdicios que encarecen el producto sin aportarle valor al cliente. Esta idea guía todo el proyecto."},{"t":"p","h":"Ohno (1988) clasificó los desperdicios en siete tipos: sobreproducción, esperas, transporte, sobreprocesamiento, inventario, movimientos innecesarios y defectos. En una línea de envasado, las esperas se manifiestan en las paradas y en los cambios de formato prolongados, y los defectos y las mermas, en los derrames y en la variación del volumen dosificado. Esta relación permite reconocer los desperdicios de la línea.","x":"Ohno (1988) clasificó los desperdicios en siete tipos: sobreproducción, esperas, transporte, sobreprocesamiento, inventario, movimientos innecesarios y defectos. En una línea de envasado, las esperas se manifiestan en las paradas y en los cambios de formato prolongados, y los defectos y las mermas, en los derrames y en la variación del volumen dosificado. Esta relación permite reconocer los desperdicios de la línea."},{"t":"p","h":"Womack y Jones (1996) ampliaron la filosofía en cinco principios: definir el valor desde la perspectiva del cliente, identificar la cadena de valor, lograr que el flujo sea continuo, producir según la demanda y buscar la perfección mediante la mejora continua. Estos principios orientan el diagnóstico y el diseño de mejoras que se desarrollan en este proyecto. Su aplicación es el hilo conductor del trabajo.","x":"Womack y Jones (1996) ampliaron la filosofía en cinco principios: definir el valor desde la perspectiva del cliente, identificar la cadena de valor, lograr que el flujo sea continuo, producir según la demanda y buscar la perfección mediante la mejora continua. Estos principios orientan el diagnóstico y el diseño de mejoras que se desarrollan en este proyecto. Su aplicación es el hilo conductor del trabajo."},{"t":"h","l":3,"h":"8.3.2. Herramientas Lean","x":"8.3.2. Herramientas Lean"},{"t":"p","h":"El Mapeo del Flujo de Valor (VSM) es la herramienta con la que se representa gráficamente el estado actual de un proceso y se identifican sus desperdicios, para luego dibujar un estado futuro mejorado (Rother y Shook, 1999). En este proyecto se usará para diagnosticar la línea de embotellamiento y localizar los cuellos de botella y los tiempos que no agregan valor. Será el punto de partida del diagnóstico.","x":"El Mapeo del Flujo de Valor (VSM) es la herramienta con la que se representa gráficamente el estado actual de un proceso y se identifican sus desperdicios, para luego dibujar un estado futuro mejorado (Rother y Shook, 1999). En este proyecto se usará para diagnosticar la línea de embotellamiento y localizar los cuellos de botella y los tiempos que no agregan valor. Será el punto de partida del diagnóstico."},{"t":"p","h":"El sistema SMED, creado por Shingo (1985), reduce el tiempo de preparación de una máquina separando las tareas que obligan a detenerla de las que pueden hacerse con ella en marcha, y simplificando ambas. Aplicado a los cambios de formato de la línea de yogurt, busca acortar el tiempo que la máquina permanece detenida entre una presentación y otra. Será la base de las mejoras propuestas para esa etapa.","x":"El sistema SMED, creado por Shingo (1985), reduce el tiempo de preparación de una máquina separando las tareas que obligan a detenerla de las que pueden hacerse con ella en marcha, y simplificando ambas. Aplicado a los cambios de formato de la línea de yogurt, busca acortar el tiempo que la máquina permanece detenida entre una presentación y otra. Será la base de las mejoras propuestas para esa etapa."},{"t":"p","h":"El Mantenimiento Productivo Total (TPM) busca que la maquinaria funcione sin averías ni paradas inesperadas, involucrando a los operarios en su cuidado; uno de sus pilares es el mantenimiento autónomo, en el que ellos inspeccionan, limpian y lubrican sus equipos (Nakajima, 1988). Es la herramienta indicada para atender la descalibración y las fallas de la máquina de envasado.","x":"El Mantenimiento Productivo Total (TPM) busca que la maquinaria funcione sin averías ni paradas inesperadas, involucrando a los operarios en su cuidado; uno de sus pilares es el mantenimiento autónomo, en el que ellos inspeccionan, limpian y lubrican sus equipos (Nakajima, 1988). Es la herramienta indicada para atender la descalibración y las fallas de la máquina de envasado."},{"t":"h","l":3,"h":"8.3.3. Efectividad Global de los Equipos (OEE)","x":"8.3.3. Efectividad Global de los Equipos (OEE)"},{"t":"p","h":"Nakajima (1988) propuso la Efectividad Global de los Equipos (OEE) para medir qué tanto se aprovecha una máquina, y la asoció con seis grandes pérdidas: averías, preparaciones y ajustes, paradas menores, reducción de velocidad, defectos del proceso y pérdidas de arranque. La Tabla 3 relaciona estas pérdidas con los problemas planteados en la línea de embotellamiento. Así se conecta la teoría con el problema.","x":"Nakajima (1988) propuso la Efectividad Global de los Equipos (OEE) para medir qué tanto se aprovecha una máquina, y la asoció con seis grandes pérdidas: averías, preparaciones y ajustes, paradas menores, reducción de velocidad, defectos del proceso y pérdidas de arranque. La Tabla 3 relaciona estas pérdidas con los problemas planteados en la línea de embotellamiento. Así se conecta la teoría con el problema."},{"t":"p","h":"<strong>Tabla 3<\/strong>","x":"Tabla 3"},{"t":"p","h":"<em>Pérdidas del OEE y su relación con la línea de embotellamiento<\/em>","x":"Pérdidas del OEE y su relación con la línea de embotellamiento"},{"t":"tbl","rows":[["<strong>Pérdida (<\/strong><strong>Nakajima<\/strong><strong>, 1988)<\/strong>","<strong>Factor del OEE<\/strong>","<strong>Posible manifestación en la línea<\/strong>","<strong>Herramienta Lean<\/strong>"],["Averías","Disponibilidad","Fallas de la máquina de envasado que detienen la línea","TPM (mantenimiento autónomo)"],["Preparaciones y ajustes","Disponibilidad","Cambios de formato prolongados y calibración de la máquina","SMED"],["Paradas menores","Rendimiento","Paradas breves por descalibración de las boquillas dosificadoras","TPM"],["Reducción de velocidad","Rendimiento","Marcha de la línea por debajo de su velocidad de diseño","VSM y TPM"],["Defectos del proceso","Calidad","Variaciones del volumen dosificado y derrames de producto","TPM y estandarización"],["Pérdidas de arranque","Calidad","Producto que se pierde al reiniciar la línea tras una parada","SMED"]],"x":"Pérdida (Nakajima, 1988) Factor del OEE Posible manifestación en la línea Herramienta Lean Averías Disponibilidad Fallas de la máquina de envasado que detienen la línea TPM (mantenimiento autónomo) Preparaciones y ajustes Disponibilidad Cambios de formato prolongados y calibración de la máquina SMED Paradas menores Rendimiento Paradas breves por descalibración de las boquillas dosificadoras TPM Reducción de velocidad Rendimiento Marcha de la línea por debajo de su velocidad de diseño VSM y TPM Defectos del proceso Calidad Variaciones del volumen dosificado y derrames de producto TPM y estandarización Pérdidas de arranque Calidad Producto que se pierde al reiniciar la línea tras una parada SMED"},{"t":"p","h":"<em>Nota. <\/em>Elaboración propia a partir de Nakajima (1988) y del planteamiento del problema. Las manifestaciones son hipótesis por confirmar con el diagnóstico.","x":"Nota. Elaboración propia a partir de Nakajima (1988) y del planteamiento del problema. Las manifestaciones son hipótesis por confirmar con el diagnóstico."},{"t":"h","l":2,"h":"8.4. Yogurt Tamaño Familiar","x":"8.4. Yogurt Tamaño Familiar"},{"t":"p","h":"En este trabajo se entiende por yogurt tamaño familiar la presentación de este producto lácteo fermentado destinada al consumo en el hogar, de mayor volumen que las presentaciones individuales. Su envasado implica dosificar una mayor cantidad de producto por unidad, por lo que una variación pequeña en el volumen dosificado se traduce en derrames o pérdidas más grandes en cada envase.","x":"En este trabajo se entiende por yogurt tamaño familiar la presentación de este producto lácteo fermentado destinada al consumo en el hogar, de mayor volumen que las presentaciones individuales. Su envasado implica dosificar una mayor cantidad de producto por unidad, por lo que una variación pequeña en el volumen dosificado se traduce en derrames o pérdidas más grandes en cada envase."},{"t":"p","h":"En la planta de Chía, la línea de fermentados produjo yogurt con trozos de fruta, yogurt tipo postre y yogurt con cereal (Cabrera Narváez y Castaño Garzón, 2003). Esta variedad de productos y presentaciones obliga a realizar cambios de formato con frecuencia, lo que explica la importancia de reducir los tiempos de preparación de la línea. Este es otro motivo para aplicar herramientas como el SMED en la línea.","x":"En la planta de Chía, la línea de fermentados produjo yogurt con trozos de fruta, yogurt tipo postre y yogurt con cereal (Cabrera Narváez y Castaño Garzón, 2003). Esta variedad de productos y presentaciones obliga a realizar cambios de formato con frecuencia, lo que explica la importancia de reducir los tiempos de preparación de la línea. Este es otro motivo para aplicar herramientas como el SMED en la línea."},{"t":"h","l":2,"h":"8.5. Industria Láctea Colombiana","x":"8.5. Industria Láctea Colombiana"},{"t":"p","h":"El sector lácteo es relevante para la economía del país: según la Bolsa Mercantil de Colombia (2025), representa el 9,3 % de la industria alimentaria y genera más de 20.500 empleos, y su análisis resalta la importancia de mejorar la eficiencia productiva. Esto muestra que optimizar los procesos de una planta láctea tiene efectos que van más allá de la empresa. Es uno de los motivos por los que este proyecto resulta pertinente.","x":"El sector lácteo es relevante para la economía del país: según la Bolsa Mercantil de Colombia (2025), representa el 9,3 % de la industria alimentaria y genera más de 20.500 empleos, y su análisis resalta la importancia de mejorar la eficiencia productiva. Esto muestra que optimizar los procesos de una planta láctea tiene efectos que van más allá de la empresa. Es uno de los motivos por los que este proyecto resulta pertinente."},{"t":"p","h":"El entorno competitivo también presiona a las empresas. Según El Tiempo (Lesmes Díaz, 2026), la apertura arancelaria para la leche en polvo de Estados Unidos desde enero de 2026 aumenta la competencia externa, y según El Colombiano (2024), el Grupo Lactalis, dueño de Parmalat, invierte en modernizar sus fábricas, entre ellas la de Chía. Ambos hechos muestran la presión por la eficiencia.","x":"El entorno competitivo también presiona a las empresas. Según El Tiempo (Lesmes Díaz, 2026), la apertura arancelaria para la leche en polvo de Estados Unidos desde enero de 2026 aumenta la competencia externa, y según El Colombiano (2024), el Grupo Lactalis, dueño de Parmalat, invierte en modernizar sus fábricas, entre ellas la de Chía. Ambos hechos muestran la presión por la eficiencia."},{"t":"p","h":"Parmalat llegó a Colombia en 1995 (Redacción Portafolio, 2014) y, de acuerdo con El Colombiano (2024), el grupo al que pertenece facturó cerca de 600.000 millones de pesos en el país el año anterior. En este contexto, mejorar la eficiencia de la línea de embotellamiento de la planta de Chía contribuye a mantener su competitividad. Esto da sentido a la propuesta de optimización de este trabajo.","x":"Parmalat llegó a Colombia en 1995 (Redacción Portafolio, 2014) y, de acuerdo con El Colombiano (2024), el grupo al que pertenece facturó cerca de 600.000 millones de pesos en el país el año anterior. En este contexto, mejorar la eficiencia de la línea de embotellamiento de la planta de Chía contribuye a mantener su competitividad. Esto da sentido a la propuesta de optimización de este trabajo."},{"t":"h","l":2,"h":"8.6. Diagnóstico de la Situación Actual","x":"8.6. Diagnóstico de la Situación Actual"},{"t":"p","h":"El diagnóstico de la situación actual se desarrolla a partir de tres fuentes: los resultados de la entrevista y la encuesta aplicadas a los estudiantes, la información documental sobre la línea y el proceso de embotellamiento, y el mapa del flujo de valor del estado actual. Con ellas se identifican los cuellos de botella, los tiempos muertos y las causas de desperdicio, y se calcula el OEE inicial. Su resultado será el punto de partida de la propuesta.","x":"El diagnóstico de la situación actual se desarrolla a partir de tres fuentes: los resultados de la entrevista y la encuesta aplicadas a los estudiantes, la información documental sobre la línea y el proceso de embotellamiento, y el mapa del flujo de valor del estado actual. Con ellas se identifican los cuellos de botella, los tiempos muertos y las causas de desperdicio, y se calcula el OEE inicial. Su resultado será el punto de partida de la propuesta."}]},{"title":"11. Referencias","cat":"Referencias","blocks":[{"t":"h","l":1,"h":"11. Referencias","x":"11. Referencias"},{"t":"p","h":"Alcaldía Municipal de Chía. (2023). <em>Plan de contingencia municipio de Chía<\/em>. <a href=\"https://www.chia-cundinamarca.gov.co/2023/banner/PLAN%20DE%20CONTINGENCIA%20MUNICIPIO%20DE%20CHIA%20C.pdf\" target=\"_blank\" rel=\"noopener\">https://www.chia-cundinamarca.gov.co/2023/banner/PLAN%20DE%20CONTINGENCIA%20MUNICIPIO%20DE%20CHIA%20C.pdf<\/a>","x":"Alcaldía Municipal de Chía. (2023). Plan <script>
(()=>{
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)],g=i=>document.getElementById(i);
const D=JSON.parse(g('d').textContent),S=D.secs,M=D.meta;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KL={h:'Título',p:'Texto',li:'Texto',tbl:'Tabla',toc:'Índice'};
const CI='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const BM={},idx=[],tocMap={};let cur=-1,terms=null,pend=null,last=[],hist=[];
try{hist=JSON.parse(sessionStorage.getItem('hq')||'[]')}catch(e){}
S.forEach((s,si)=>{let sub='';s.blocks.forEach((b,k)=>{b.id='b'+si+'_'+k;BM[b.id]=b;
if(b.t==='h'){if(b.l>1){sub=b.x;if(!tocMap[norm(b.x)])tocMap[norm(b.x)]=[si,b.id]}else sub=''}
if(b.t==='tbl')b.x=b.rows.map(r=>r.map(c=>c.replace(/<[^>]+>/g,' ').trim()).join('\t')).join('\n');
const x=b.x||'';if(!x.trim())return;idx.push({si,id:b.id,sub:b.t==='h'?'':sub,t:b.t,x,n:norm(x)})});tocMap[norm(s.title)]=[si,null]});
const words=s=>s.blocks.reduce((a,b)=>a+(b.x?b.x.split(/\s+/).length:0),0);
const cp=b=>`<button class="cp" data-cp="${b.id}" aria-label="Copiar fragmento" title="Copiar">${CI}</button>`;
function rb(b){
if(b.t==='p'||b.t==='li')return `<p id="${b.id}" class="blk${b.t==='li'?' li':''}">${b.h}${cp(b)}</p>`;
if(b.t==='img'){return `<figure id="${b.id}" class="blk"><img loading="lazy" data-r="${b.src}" alt="Figura del documento">${cp({id:b.id})}</figure>`}
if(b.t==='toc'){const t=tocMap[norm(b.x.trim())];const l=t?`<a href="#s${t[0]}" data-go="${t[0]}" data-a="${t[1]||''}">${b.h}</a>`:b.h;return `<p id="${b.id}" class="tl"><span>${l}</span><i class="dt"></i><span class="pg">${b.pg}</span></p>`}
if(b.t==='tbl'){const hd=b.rows.length>2;return `<div id="${b.id}" class="tw">${cp(b)}<table>${b.rows.map((r,i)=>`<tr>${r.map(c=>`<${hd&&!i?'th':'td'}>${c}</${hd&&!i?'th':'td'}>`).join('')}</tr>`).join('')}</table></div>`}
return ''}
function tree(bl){const root={ch:[]},st=[{l:1,n:root}];bl.forEach(b=>{if(b.t==='h'){if(b.l===1)return;while(st[st.length-1].l>=b.l)st.pop();const n={b,ch:[]};st[st.length-1].n.ch.push(n);st.push({l:b.l,n})}else st[st.length-1].n.ch.push(b)});return root.ch}
function rn(a){return a.map(x=>{if(!x.ch)return rb(x);const l=Math.min(x.b.l+1,5);return `<details class="sub" id="${x.b.id}" open><summary><h${l} class="hd">${x.b.h}</h${l}>${cp(x.b)}</summary><div class="in">${rn(x.ch)}</div></details>`}).join('')}
function sec(si){const s=S[si],w=words(s),nt=s.blocks.filter(b=>b.t==='tbl').length,nf=s.blocks.filter(b=>b.t==='img').length;
const pv=si>0?[si-1,S[si-1].title]:[-1,'Inicio'],nx=si<S.length-1?[si+1,S[si+1].title]:null;
return `<article class="prose"><span class="chip">${s.cat}</span><h1>${esc(s.title)}</h1><p class="meta">${w.toLocaleString('es')} palabras · ${Math.max(1,Math.round(w/200))} min de lectura${nt?` · ${nt} tabla${nt>1?'s':''}`:''}${nf?` · ${nf} figura${nf>1?'s':''}`:''}</p>
<div class="tb"><button class="bt" data-ex="1">Expandir todo</button><button class="bt" data-ex="0">Contraer todo</button><button class="bt" data-clr ${terms?'':'hidden'}>Quitar resaltado</button></div>${rn(tree(s.blocks))}
<nav class="pn"><button class="bt" data-go="${pv[0]}"><small>← Anterior</small>${esc(pv[1])}</button>${nx?`<button class="bt nx" data-go="${nx[0]}"><small>Siguiente →</small>${esc(nx[1])}</button>`:''}</nav></article>`}
function after(re,lv){for(const s of S){const b=s.blocks;for(let i=0;i<b.length;i++)if(b[i].t==='h'&&re.test(norm(b[i].x))&&(!lv||b[i].l===lv)){const o=[];for(let j=i+1;j<b.length&&b[j].t!=='h';j++)if(b[j].t==='p')o.push(b[j].x);if(o.length)return[s,o.join(' '),b[i].id]}}return null}
