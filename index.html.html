eñaron a escribir con mayor precisión, a sustentar cada afirmación con fuentes y a mejorar de manera constante nuestro trabajo.","x":"Expresamos nuestro sincero agradecimiento a la profesora Claudia Ester Herrera Tenjo, cuya orientación académica, rigor metodológico y conocimientos guiaron la estructuración y el desarrollo del presente trabajo de investigación. Sus correcciones y observaciones nos enseñaron a escribir con mayor precisión, a sustentar cada afirmación con fuentes y a mejorar de manera constante nuestro trabajo."},{"t":"p","h":"Agradecemos igualmente a los estudiantes de la Universidad Militar Nueva Granada que participaron en la entrevista y la encuesta, y a quienes apoyaron el desarrollo de esta propuesta de mejora. Su tiempo y su disposición para compartir su experiencia como consumidores de yogurt fueron fundamentales para comprender mejor los problemas del envase que se estudian y para plantear soluciones.","x":"Agradecemos igualmente a los estudiantes de la Universidad Militar Nueva Granada que participaron en la entrevista y la encuesta, y a quienes apoyaron el desarrollo de esta propuesta de mejora. Su tiempo y su disposición para compartir su experiencia como consumidores de yogurt fueron fundamentales para comprender mejor los problemas del envase que se estudian y para plantear soluciones."}]},{"title":"Prefacio","cat":"Preliminares","blocks":[{"t":"h","l":1,"h":"Prefacio","x":"Prefacio"},{"t":"p","h":"El presente proyecto de investigación aborda una problemática operativa del sector agroindustrial colombiano, específicamente en la línea de embotellamiento de yogurt tamaño familiar de la planta de Parmalat Ltda., ubicada en el municipio de Chía, Cundinamarca. La competitividad industrial exige maximizar la eficiencia de los sistemas productivos mediante la eliminación de desperdicios y la reducción de las variabilidades.","x":"El presente proyecto de investigación aborda una problemática operativa del sector agroindustrial colombiano, específicamente en la línea de embotellamiento de yogurt tamaño familiar de la planta de Parmalat Ltda., ubicada en el municipio de Chía, Cundinamarca. La competitividad industrial exige maximizar la eficiencia de los sistemas productivos mediante la eliminación de desperdicios y la reducción de las variabilidades."},{"t":"p","h":"Este trabajo surge como una iniciativa académica orientada a integrar los principios de Lean Manufacturing con las demandas prácticas del sector de alimentos. A través de un enfoque metódico, los autores buscan diagnosticar el proceso y proponer mejoras aplicables que eleven la Efectividad Global de los Equipos (OEE) de la línea de embotellamiento. El documento reúne el planteamiento, el fundamento teórico y la metodología.","x":"Este trabajo surge como una iniciativa académica orientada a integrar los principios de Lean Manufacturing con las demandas prácticas del sector de alimentos. A través de un enfoque metódico, los autores buscan diagnosticar el proceso y proponer mejoras aplicables que eleven la Efectividad Global de los Equipos (OEE) de la línea de embotellamiento. El documento reúne el planteamiento, el fundamento teórico y la metodología."}]},{"title":"Resumen","cat":"Preliminares","blocks":[{"t":"h","l":1,"h":"Resumen","x":"Resumen"},{"t":"p","h":"El presente estudio tiene como objetivo optimizar el proceso de embotellamiento de yogurt tamaño familiar en la planta de Parmalat Ltda., ubicada en Chía, Cundinamarca, mediante el uso de herramientas de Lean Manufacturing. Se plantea que la línea presenta fallas en la máquina de envasado, como la descalibración de las boquillas dosificadoras, que ocasionan paradas no programadas, derrames de producto y cambios de formato prolongados. Se adopta un enfoque mixto de tipo analítico y aplicado: se recolectará información mediante una entrevista y una encuesta a estudiantes de la Universidad Militar Nueva Granada como consumidores, y se analizarán los tiempos y la eficiencia de los equipos. Con el Mapeo del Flujo de Valor (VSM), el sistema SMED y el Mantenimiento Productivo Total (TPM) se diagnosticarán las causas de los desperdicios y se diseñará una propuesta de mejora. Se espera reducir los tiempos muertos y las mermas, e incrementar la Efectividad Global de los Equipos (OEE) de la línea.","x":"El presente estudio tiene como objetivo optimizar el proceso de embotellamiento de yogurt tamaño familiar en la planta de Parmalat Ltda., ubicada en Chía, Cundinamarca, mediante el uso de herramientas de Lean Manufacturing. Se plantea que la línea presenta fallas en la máquina de envasado, como la descalibración de las boquillas dosificadoras, que ocasionan paradas no programadas, derrames de producto y cambios de formato prolongados. Se adopta un enfoque mixto de tipo analítico y aplicado: se recolectará información mediante una entrevista y una encuesta a estudiantes de la Universidad Militar Nueva Granada como consumidores, y se analizarán los tiempos y la eficiencia de los equipos. Con el Mapeo del Flujo de Valor (VSM), el sistema SMED y el Mantenimiento Productivo Total (TPM) se diagnosticarán las causas de los desperdicios y se diseñará una propuesta de mejora. Se espera reducir los tiempos muertos y las mermas, e incrementar la Efectividad Global de los Equipos (OEE) de la línea."},{"t":"p","h":"<em>Palabras clave: <\/em>Lean Manufacturing, embotellamiento, yogurt tamaño familiar, OEE, SMED, VSM, optimización de procesos.","x":"Palabras clave: Lean Manufacturing, embotellamiento, yogurt tamaño familiar, OEE, SMED, VSM, optimización de procesos."}]},{"title":"Abstract","cat":"Preliminares","blocks":[{"t":"h","l":1,"h":"Abstract","x":"Abstract"},{"t":"p","h":"This study aims to optimize the bottling process of family-size yogurt at the Parmalat Ltda. plant in Chía, Cundinamarca, Colombia, through the use of Lean Manufacturing tools. The line is reported to suffer from filling machine failures, such as the miscalibration of dosing nozzles, which cause unscheduled stoppages, product spillage and long format changeovers. A mixed, analytical and applied approach is adopted: information will be collected through an interview and a survey of university students as consumers, and times and equipment efficiency will be analyzed. Using Value Stream Mapping (VSM), Single-Minute Exchange of Die (SMED) and Total Productive Maintenance (TPM), the root causes of waste will be diagnosed and an improvement proposal will be designed. The expected outcomes are a reduction in downtime and product loss, and an increase in the Overall Equipment Effectiveness (OEE) of the line.","x":"This study aims to optimize the bottling process of family-size yogurt at the Parmalat Ltda. plant in Chía, Cundinamarca, Colombia, through the use of Lean Manufacturing tools. The line is reported to suffer from filling machine failures, such as the miscalibration of dosing nozzles, which cause unscheduled stoppages, product spillage and long format changeovers. A mixed, analytical and applied approach is adopted: information will be collected through an interview and a survey of university students as consumers, and times and equipment efficiency will be analyzed. Using Value Stream Mapping (VSM), Single-Minute Exchange of Die (SMED) and Total Productive Maintenance (TPM), the root causes of waste will be diagnosed and an improvement proposal will be designed. The expected outcomes are a reduction in downtime and product loss, and an increase in the Overall Equipment Effectiveness (OEE) of the line."},{"t":"p","h":"<em>Keywords<\/em><em>: <\/em>Lean Manufacturing, bottling, family-size yogurt, OEE, SMED, VSM, process optimization.","x":"Keywords: Lean Manufacturing, bottling, family-size yogurt, OEE, SMED, VSM, process optimization."}]},{"title":"Tabla de Contenido","cat":"Preliminares","blocks":[{"t":"h","l":1,"h":"Tabla de Contenido","x":"Tabla de Contenido"},{"t":"toc","h":"Dedicatoria","x":"Dedicatoria","pg":"2"},{"t":"toc","h":"Agradecimientos","x":"Agra hía en el departamento de Cundinamarca","pg":"24"},{"t":"toc","h":"Figura 4. Mapa geográfico de Cajicá","x":"Figura 4. Mapa geográfico de Cajicá","pg":"25"},{"t":"toc","h":"Figura 5. Universidad Militar Nueva Granada, Campus Cajicá","x":"Figura 5. Universidad Militar Nueva Granada, Campus Cajicá","pg":"25"},{"t":"toc","h":"Figura 6. Línea de ensamble móvil de Ford en 1913","x":"Figura 6. Línea de ensamble móvil de Ford en 1913","pg":"26"},{"t":"toc","h":"Figura 7. Sistema de Producción Toyota","x":"Figura 7. Sistema de Producción Toyota","pg":"26"},{"t":"toc","h":"Figura 8. Portada del libro The Machine That Changed the World","x":"Figura 8. Portada del libro The Machine That Changed the World","pg":"27"},{"t":"toc","h":"Figura 9. Portada del libro Lean Thinking","x":"Figura 9. Portada del libro Lean Thinking","pg":"27"},{"t":"toc","h":"Figura 10. Parmalat en Colombia","x":"Figura 10. Parmalat en Colombia","pg":"28"},{"t":"toc","h":"Figura 11. Planta de Parmalat Colombia en Chía","x":"Figura 11. Planta de Parmalat Colombia en Chía","pg":"28"}]},{"title":"Nota de Aceptación","cat":"Preliminares","blocks":[{"t":"h","l":1,"h":"Nota de Aceptación","x":"Nota de Aceptación"},{"t":"p","h":"________________________________________","x":"________________________________________"},{"t":"p","h":"________________________________________","x":"________________________________________"},{"t":"p","h":"________________________________________","x":"________________________________________"},{"t":"p","h":"________________________________________","x":"________________________________________"},{"t":"p","h":"Presidente de Jurado","x":"Presidente de Jurado"},{"t":"p","h":"_________________________________","x":"_________________________________"},{"t":"p","h":"Jurado 1","x":"Jurado 1"},{"t":"p","h":"_________________________________","x":"_________________________________"},{"t":"p","h":"Jurado 2","x":"Jurado 2"},{"t":"p","h":"_________________________________","x":"_________________________________"}]},{"title":"1. Introducción","cat":"Planteamiento","blocks":[{"t":"h","l":1,"h":"1. Introducción","x":"1. Introducción"},{"t":"p","h":"La industria láctea colombiana enfrenta un entorno de alta competencia en el que la eficiencia de las líneas de producción es clave para sostener los costos y la calidad. En este contexto, el embotellamiento de yogurt tamaño familiar en la planta de Parmalat Ltda. en Chía se plantea como un proceso con fallas en la máquina de envasado y con tiempos de cambio de formato prolongados que afectan su productividad.","x":"La industria láctea colombiana enfrenta un entorno de alta competencia en el que la eficiencia de las líneas de producción es clave para sostener los costos y la calidad. En este contexto, el embotellamiento de yogurt tamaño familiar en la planta de Parmalat Ltda. en Chía se plantea como un proceso con fallas en la máquina de envasado y con tiempos de cambio de formato prolongados que afectan su productividad."},{"t":"p","h":"Este trabajo propone aplicar herramientas de Lean Manufacturing, en particular el Mapeo del Flujo de Valor (VSM), el sistema SMED y el Mantenimiento Productivo Total (TPM), para diagnosticar las causas de las pérdidas y diseñar mejoras en el proceso. Se adopta un enfoque mixto, de tipo analítico y aplicado, que combina una entrevista y una encuesta a estudiantes de la universidad, como consumidores, con el análisis del proceso de embotellamiento.","x":"Este trabajo propone aplicar herramientas de Lean Manufacturing, en particular el Mapeo del Flujo de Valor (VSM), el sistema SMED y el Mantenimiento Productivo Total (TPM), para diagnosticar las causas de las pérdidas y diseñar mejoras en el proceso. Se adopta un enfoque mixto, de tipo analítico y aplicado, que combina una entrevista y una encuesta a estudiantes de la universidad, como consumidores, con el análisis del proceso de embotellamiento."},{"t":"p","h":"El documento se organiza así: primero se presentan la justificación, el planteamiento del problema, la pregunta, la hipótesis y los objetivos; luego se describe la metodología y se desarrolla el marco teórico, con sus marcos geográfico, histórico, de antecedentes, conceptual y legal; finalmente se incluyen los capítulos que desarrollan cada objetivo específico, las referencias y los anexos.","x":"El documento se organiza así: primero se presentan la justificación, el planteamiento del problema, la pregunta, la hipótesis y los objetivos; luego se describe la metodología y se desarrolla el marco teórico, con sus marcos geográfico, histórico, de antecedentes, conceptual y legal; finalmente se incluyen los capítulos que desarrollan cada objetivo específico, las referencias y los anexos."}]},{"title":"2. Justificación","cat":"Planteamiento","blocks":[{"t":"h","l":1,"h":"2. Justificación","x":"2. Justificación"},{"t":"p","h":"La línea de embotellamiento de yogurt tamaño familiar de Parmalat Ltda. en Chía presenta fallas en la máquina de envasado, entre ellas la descalibración de las boquillas dosificadoras, que generan paradas no programadas, derrames de producto y cambios de formato demasiado largos. Estas pérdidas reducen la disponibilidad de la línea, elevan los costos unitarios y retrasan los despachos, por lo que es necesario intervenir el proceso.","x":"La línea de embotellamiento de yogurt tamaño familiar de Parmalat Ltda. en Chía presenta fallas en la máquina de envasado, entre ellas la descalibración de las boquillas dosificadoras, que generan paradas no programadas, derrames de producto y cambios de formato demasiado largos. Estas pérdidas reducen la disponibilidad de la línea, elevan los costos unitarios y retrasan los despachos, por lo que es necesario intervenir el proceso."},{"t":"p","h":"Lean Manufacturing es una filosofía de gestión derivada del Sistema de Producción Toyota, desarrollado por Ohno (1988), que busca eliminar los desperdicios, es decir, toda actividad que consume recursos sin agregar valor al cliente. Womack y Jones (1996) la resumen en cinco principios: definir el valor, identificar la cadena de valor, crear flujo, producir según la demanda y perseguir la perfección de forma continua.","x":"Lean Manufacturing es una filosofía de gestión derivada del Sistema de Producción Toyota, desarrollado por Ohno (1988), que busca eliminar los desperdicios, es decir, toda actividad que consume recursos sin agregar valor al cliente. Womack y Jones (1996) la resumen en cinco principios: definir el valor, identificar la cadena de valor, crear flujo, producir según la demanda y perseguir la perfección de forma continua."},{"t":"p","h":"Para este proyecto se emplearán tres herramientas de Lean Manufacturing. El Mapeo del Flujo de Valor (VSM) permite visualizar los desperdicios del proceso (Rother y Shook, 1999), el sistema SMED reduce los tiempos de cambio de formato (Shingo, 1985) y el Mantenimiento Productivo Total (TPM) busca disminuir las paradas por fallas de los equipos (Nakajima, 1988), tres problemas presentes en la línea.","x":"Para este proyecto se emplearán tres herramientas de Lean Manufacturing. El Mapeo del Flujo de Valor (VSM) permite visualizar los desperdicios del proceso (Rother y Shook, 1999), el sistema SMED reduce los tiempos de cambio de formato (Shingo, 1985) y el Mantenimiento Productivo Total (TPM) busca disminuir las paradas por fallas de los equipos (Nakajima, 1988), tres problemas presentes en la línea."},{"t":"p","h":"Existen antecedentes que respaldan esta propuesta: Vinueza Párraga (2018) redujo en promedio a la mitad los tiempos de cambio de formato en el envasado de yogurt de una planta ecuatoriana aplicando SMED. Optimizar la línea de Parmalat contribuiría a mejorar su eficiencia y su competitividad en el mercado lácteo, y permitiría al equipo aplicar conocimientos de ingeniería industrial a un problema real.","x":"Existen antecedentes que respaldan esta propuesta: Vinueza Párraga (2018) redujo en promedio a la mitad los tiempos de cambio de formato en el envasado de yogurt de una planta ecuatoriana aplicando SMED. Optimizar la línea de Parmalat contribuiría a mejorar su eficiencia y su competitividad en el mercado lácteo, y permitiría al equipo aplicar conocimientos de ingeniería industrial a un problema real."}]},{"title":"3. Planteamiento del Problema","cat":"Planteamiento","blocks":[{"t":"h","l":1,"h":"3. Planteamiento del Problema","x":"3. Planteamiento del Problema"},{"t":"p","h":"El sector lácteo colombiano enfrenta una fuerte presión competitiva. Según El Tiempo (Lesmes Díaz, 2026), la industria advierte sobre la competencia externa y la informalidad, mientras que la apertura arancelaria para la leche en polvo de Estados Unidos, vigente desde enero de 2026, presiona a las procesadoras a reducir sus costos de operación y a ser más eficientes en cada una de sus líneas de producción.","x":"El sector lácteo colombiano enfrenta una fuerte presión competitiva. Según El Tiempo (Lesmes Díaz, 2026), la industria advierte sobre la competencia externa y la informalidad, mientras que la apertura arancelaria para la leche en polvo de Estados Unidos, vigente desde enero de 2026, presiona a las procesadoras a reducir sus costos de operación y a ser más eficientes en cada una de sus líneas de producción."},{"t":"p","h":"Parmalat Colombia opera la planta de Chía, donde se elaboran derivados lácteos como el yogurt. En esta planta ya se han documentado pérdidas de producto: Cabrera Narváez y Castaño Garzón (2003) estimaron que cerca del 15,6 % de la producción inicial se perdía en los lavados y empujes del proceso y propusieron mejoras para reducirlas, lo que muestra que la eficiencia del proceso es una preocupación histórica.","x":"Parmalat Colombia opera la planta de Chía, donde se elaboran derivados lácteos como el yogurt. En esta planta ya se han documentado pérdidas de producto: Cabrera Narváez y Castaño Garzón (2003) estimaron que cerca del 15,6 % de la producción inicial se perdía en los lavados y empujes del proceso y propusieron mejoras para reducirlas, lo que muestra que la eficiencia del proceso es una preocupación histórica."},{"t":"p","h":"De acuerdo con lo planteado por el equipo investigador, en la línea de embotellamiento de yogurt tamaño familiar el problema se concentra en la máquina de envasado: la descalibración de las boquillas dosificadoras provoca paradas y derrames, y los cambios de formato exigen mucho tiempo. Situaciones similares se han descrito en otras plantas; Vinueza Párraga (2018) reportó atascos por calibración incorrecta y cambios de formato de 2,5 horas.","x":"De acuerdo con lo planteado por el equipo investigador, en la línea de embotellamiento de yogurt tamaño familiar el problema se concentra en la máquina de envasado: la descalibración de las boquillas dosificadoras provoca paradas y derrames, y los cambios de formato exigen mucho tiempo. Situaciones similares se han descrito en otras plantas; Vinueza Párraga (2018) reportó atascos por calibración incorrecta y cambios de formato de 2,5 horas."},{"t":"p","h":"Estas pérdidas reducen la disponibilidad de la línea y la Efectividad Global de los Equipos (OEE), aumentan las mermas de producto y retrasan los despachos. Por ello se propone aplicar herramientas de Lean Manufacturing para diagnosticar las causas del problema y diseñar mejoras en el proceso de embotellamiento, lo cual da origen a la pregunta problema y a los objetivos que se presentan a continuación.","x":"Estas pérdidas reducen la disponibilidad de la línea y la Efectividad Global de los Equipos (OEE), aumentan las mermas de producto y retrasan los despachos. Por ello se propone aplicar herramientas de Lean Manufacturing para diagnosticar las causas del problema y diseñar mejoras en el proceso de embotellamiento, lo cual da origen a la pregunta problema y a los objetivos que se presentan a continuación."},{"t":"h","l":2,"h":"3.1. Pregunta Problema","x":"3.1. Pregunta Problema"},{"t":"p","h":"¿De qué manera la aplicación de las herramientas de Lean Manufacturing permite optimizar el proceso de embotellamiento del yogurt tamaño familiar en la planta de Parmalat Ltda. ubicada en Chía, Cundinamarca, durante el año 2026?","x":"¿De qué manera la aplicación de las herramientas de Lean Manufacturing permite optimizar el proceso de embotellamiento del yogurt tamaño familiar en la planta de Parmalat Ltda. ubicada en Chía, Cundinamarca, durante el año 2026?"}]},{"title":"4. Hipótesis","cat":"Planteamiento","blocks":[{"t":"h","l":1,"h":"4. Hipótesis","x":"4. Hipótesis"},{"t":"p","h":"Es posible que con la implementación de herramientas de Lean Manufacturing se optimice el proceso de embotellamiento del yogurt tamaño familiar en la planta de Parmalat Ltda., ubicada en Chía, Cundinamarca, durante el año 2026.","x":"Es posible que con la implementación de herramientas de Lean Manufacturing se optimice el proceso de embotellamiento del yogurt tamaño familiar en la planta de Parmalat Ltda., ubicada en Chía, Cundinamarca, durante el año 2026."}]},{"title":"5. Objetivos","cat":"Planteamiento","blocks":[{"t":"h","l":1,"h":"5. Objetivos","x":"5. Objetivos"},{"t":"h","l":2,"h":"5.1. Objetivo General","x":"5.1. Objetivo General"},{"t":"p","h":"Optimizar los procesos de embotellamiento del yogurt tamaño familiar mediante el uso de Lean Manufacturing en la empresa Parmalat Ltda., ubicada en Chía, Cundinamarca, durante el año 2026, con el fin de incrementar la eficiencia operativa y reducir los desperdicios en la línea productiva.","x":"Optimizar los procesos de embotellamiento del yogurt tamaño familiar mediante el uso de Lean Manufacturing en la empresa Parmalat Ltda., ubicada en Chía, Cundinamarca, durante el año 2026, con el fin de incrementar la eficiencia operativa y reducir los desperdicios en la línea productiva."},{"t":"h","l":2,"h":"5.2. Objetivos Específicos","x":"5.2. Objetivos Específicos"},{"t":"li","h":"Diagnosticar la situación operacional actual del proceso de embotellamiento de yogurt tamaño familiar en Parmalat Ltda., identificando los cuellos de botella, los tiempos muertos y las principales causas de desperdicio.","x":"Diagnosticar la situación operacional actual del proceso de embotellamiento de yogurt tamaño familiar en Parmalat Ltda., identificando los cuellos de botella, los tiempos muertos y las principales causas de desperdicio."},{"t":"li","h":"Diseñar un conjunto de intervenciones operativas basadas en herramientas de Lean Manufacturing (VSM, SMED y TPM) adaptadas a la maquinaria de envasado de yogurt tamaño familiar.","x":"Diseñar un conjunto de intervenciones operativas basadas en herramientas de Lean Manufacturing (VSM, SMED y TPM) adaptadas a la maquinaria de envasado de yogurt tamaño familiar."},{"t":"li","h":"Evaluar el impacto de la propuesta de optimización sobre la Efectividad Global de los Equipos (OEE) y la productividad de la línea de embotellamiento en la planta de Chía.","x":"Evaluar el impacto de la propuesta de optimización sobre la Efectividad Global de los Equipos (OEE) y la productividad de la línea de embotellamiento en la planta de Chía."}]},{"title":"6. Metodología","cat":"Metodología","blocks":[{"t":"h","l":1,"h":"6. Metodología","x":"6. Metodología"},{"t":"h","l":2,"h":"6.1. Diseño Metodológico","x":"6.1. Diseño Metodológico"},{"t":"p","h":"El diseño metodológico resume cómo se cumplirá cada objetivo específico del proyecto: las fases de la investigación, las fuentes de información, las herramientas y técnicas que se emplearán y el entregable que se espera en cada fase. La Tabla 1 presenta el cuadro metodológico, que organiza la investigación en tres fases: diagnóstico de la situación actual, diseño de las intervenciones Lean y evaluación de su impacto.","x":"El diseño metodológico resume cómo se cumplirá cada objetivo específico del proyecto: las fases de la investigación, las fuentes de información, las herramientas y técnicas que se emplearán y el entregable que se espera en cada fase. La Tabla 1 presenta el cuadro metodológico, que organiza la investigación en tres fases: diagnóstico de la situación actual, diseño de las intervenciones Lean y evaluación de su impacto."},{"t":"p","h":"<strong>Tabla 1<\/strong>","x":"Tabla 1"},{"t":"p","h":"<em>Matriz del Cuadro Metodológico de Investigación<\/em>","x":"Matriz del Cuadro Metodológico de Investigación"},{"t":"tbl","rows":[["<strong>Objetivo específico<\/strong>","<strong>Fase<\/strong>","<strong>Fuentes de información<\/strong>","<strong>Herramientas y técnicas<\/strong>","<strong>Entregable<\/strong>"],["Diagnosticar la situación actual","Fase 1: Diagnóstico situacional","Estudiantes de la Universidad Militar Nueva Granada; fuentes documentales sobre la línea","Entrevista; encuesta; VSM actual; diagrama de Ishikawa","Mapa VSM actual e indicador OEE inicial de la línea"],["Diseñar intervenciones Lean","Fase 2: Diseño de soluciones de optimización","Manuales de la maquinaria; referentes técnicos; personal de mantenimiento","Matriz SMED; plan de mantenimiento autónomo (TPM)","Manual de estandarización y propuesta de mejoras SMED y TPM"],["Evaluar el impacto de la propuesta","Fase 3: Evaluación y validación de resultados","Datos proyectados de producción","VSM futuro; análisis comparativo del OEE","Reporte de impacto técnico-económico y VSM futuro"]],"x":"Objetivo específico Fase Fuentes de información Herramientas y técnicas Entregable Diagnosticar la situación actual Fase 1: Diagnóstico situacional Estudiantes de la Universidad Militar Nueva Granada; fuentes documentales sobre la línea Entrevista; encuesta; VSM actual; diagrama de Ishikawa Mapa VSM actual e indicador OEE inicial de la línea Diseñar intervenciones Lean Fase 2: Diseño de soluciones de optimización Manuales de la maquinaria; referentes técnicos; personal de mantenimiento Matriz SMED; plan de mantenimiento autónomo (TPM) Manual de estandarización y propuesta de mejoras SMED y TPM Evaluar el impacto de la propuesta Fase 3: Evaluación y validación de resultados Datos proyectados de producción VSM futuro; análisis comparativo del OEE Reporte de impacto técnico-económico y VSM futuro"},{"t":"p","h":"<em>Nota. <\/em>Elaboración propia.","x":"Nota. Elaboración propia."},{"t":"h","l":2,"h":"6.2. Enfoque de la Investigación","x":"6.2. Enfoque de la Investigación"},{"t":"p","h":"La presente investigación adopta un enfoque mixto, porque el problema de la línea de embotellamiento exige medir datos numéricos, como los tiempos de paro y la eficiencia de los equipos, y también comprender la opinión y la experiencia de las personas que trabajan en el proceso. Combinar ambas perspectivas permite diagnosticar las causas del problema con mayor profundidad en la línea de producción.","x":"La presente investigación adopta un enfoque mixto, porque el problema de la línea de embotellamiento exige medir datos numéricos, como los tiempos de paro y la eficiencia de los equipos, y también comprender la opinión y la experiencia de las personas que trabajan en el proceso. Combinar ambas perspectivas permite diagnosticar las causas del problema con mayor profundidad en la línea de producción."},{"t":"p","h":"Hernández-Sampieri y Mendoza (2018) explican que los métodos mixtos representan “un conjunto de procesos sistemáticos, empíricos y críticos de investigación” (p. 612) que integran datos cuantitativos y cualitativos. Esta definición respalda el enfoque elegido, pues el diagnóstico de la línea requiere procesos ordenados de recolección y análisis de ambos tipos de datos para entender el problema.","x":"Hernández-Sampieri y Mendoza (2018) explican que los métodos mixtos representan “un conjunto de procesos sistemáticos, empíricos y críticos de investigación” (p. 612) que integran datos cuantitativos y cualitativos. Esta definición respalda el enfoque elegido, pues el diagnóstico de la línea requiere procesos ordenados de recolección y análisis de ambos tipos de datos para entender el problema."},{"t":"p","h":"Por su parte, Johnson y Onwuegbuzie (2004) plantean que la investigación mixta combina elementos de los enfoques cuantitativo y cualitativo, en aspectos como la recolección y el análisis de los datos, con el propósito de lograr mayor amplitud y profundidad en la comprensión del fenómeno y de contrastar los resultados obtenidos desde cada enfoque. Esto respalda la combinación de ambos tipos de datos.","x":"Por su parte, Johnson y Onwuegbuzie (2004) plantean que la investigación mixta combina elementos de los enfoques cuantitativo y cualitativo, en aspectos como la recolección y el análisis de los datos, con el propósito de lograr mayor amplitud y profundidad en la comprensión del fenómeno y de contrastar los resultados obtenidos desde cada enfoque. Esto respalda la combinación de ambos tipos de datos."},{"t":"p","h":"En este proyecto, el componente cuantitativo se desarrolla mediante una encuesta de cinco variables aplicada a diez estudiantes, cuyos resultados se expresan en números y porcentajes. El componente cualitativo se desarrolla mediante una entrevista de cinco preguntas a otros diez estudiantes, cuyas respuestas se agrupan en categorías. Así se logra una visión completa de la experiencia de los consumidores con el envase del yogurt.","x":"En este proyecto, el componente cuantitativo se desarrolla mediante una encuesta de cinco variables aplicada a diez estudiantes, cuyos resultados se expresan en números y porcentajes. El componente cualitativo se desarrolla mediante una entrevista de cinco preguntas a otros diez estudiantes, cuyas respuestas se agrupan en categorías. Así se logra una visión completa de la experiencia de los consumidores con el envase del yogurt."},{"t":"h","l":2,"h":"6.3. Tipo de Investigación","x":"6.3. Tipo de Investigación"},{"t":"p","h":"El tipo de investigación se define según el propósito del estudio y el nivel de profundidad con que se aborda el problema. Este proyecto es de tipo analítico, porque busca descomponer el proceso de embotellamiento para encontrar las causas de las fallas, y aplicado, porque sus resultados se orientan a proponer soluciones concretas para la línea de producción de Parmalat. Ambas características orientan el diseño de todo el trabajo.","x":"El tipo de investigación se define según el propósito del estudio y el nivel de profundidad con que se aborda el problema. Este proyecto es de tipo analítico, porque busca descomponer el proceso de embotellamiento para encontrar las causas de las fallas, y aplicado, porque sus resultados se orientan a proponer soluciones concretas para la línea de producción de Parmalat. Ambas características orientan el diseño de todo el trabajo."},{"t":"p","h":"Hurtado de Barrera (2007) sostiene que la investigación analítica estudia un evento para comprenderlo a partir de sus aspectos menos evidentes, es decir, analiza sus partes para descubrir las relaciones que lo explican. Esto coincide con el objetivo de diagnosticar los cuellos de botella, los tiempos muertos y las causas de desperdicio presentes en la línea. De esta manera, el análisis permite pasar de los síntomas visibles a las causas.","x":"Hurtado de Barrera (2007) sostiene que la investigación analítica estudia un evento para comprenderlo a partir de sus aspectos menos evidentes, es decir, analiza sus partes para descubrir las relaciones que lo explican. Esto coincide con el objetivo de diagnosticar los cuellos de botella, los tiempos muertos y las causas de desperdicio presentes en la línea. De esta manera, el análisis permite pasar de los síntomas visibles a las causas."},{"t":"p","h":"Vargas Cordero (2009) señala que la investigación aplicada se caracteriza por su interés en usar los conocimientos disponibles para resolver problemas prácticos y concretos de la realidad. En este proyecto, ese carácter aplicado se refleja en que el diagnóstico y las herramientas de Lean Manufacturing se orientan a mejorar el desempeño real de la línea y no solo a describirla ni a analizarla en el papel.","x":"Vargas Cordero (2009) señala que la investigación aplicada se caracteriza por su interés en usar los conocimientos disponibles para resolver problemas prácticos y concretos de la realidad. En este proyecto, ese carácter aplicado se refleja en que el diagnóstico y las herramientas de Lean Manufacturing se orientan a mejorar el desempeño real de la línea y no solo a describirla ni a analizarla en el papel."},{"t":"p","h":"En consecuencia, el estudio analiza el flujo de trabajo de la línea, sus tiempos y sus fallas, para identificar las causas raíz, y con ellas diseña una propuesta de optimización con VSM, SMED y TPM. La propuesta se evalúa comparando el estado actual y el estado futuro del proceso, medidos con indicadores como el OEE y los tiempos de paro. Con ello se cierra el ciclo de la investigación, desde el diagnóstico hasta la evaluación del impacto.","x":"En consecuencia, el estudio analiza el flujo de trabajo de la línea, sus tiempos y sus fallas, para identificar las causas raíz, y con ellas diseña una propuesta de optimización con VSM, SMED y TPM. La propuesta se evalúa comparando el estado actual y el estado futuro del proceso, medidos con indicadores como el OEE y los tiempos de paro. Con ello se cierra el ciclo de la investigación, desde el diagnóstico hasta la evaluación del impacto."},{"t":"h","l":2,"h":"6.4. Herramientas/Instrumentos","x":"6.4. Herramientas/Instrumentos"},{"t":"p","h":"Para recolectar la información primaria se utilizan dos herramientas: una entrevista y una encuesta. Ambas se dirigen a estudiantes de la Universidad Militar Nueva Granada, que son consumidores de yogurt, y permiten conocer desde su experiencia los problemas que perciben en el envase, las pérdidas de producto y las mejoras que consideran necesarias. Además, sus resultados se relacionan con el análisis del proceso de embotellamiento.","x":"Para recolectar la información primaria se utilizan dos herramientas: una entrevista y una encuesta. Ambas se dirigen a estudiantes de la Universidad Militar Nueva Granada, que son consumidores de yogurt, y permiten conocer desde su experiencia los problemas que perciben en el envase, las pérdidas de producto y las mejoras que consideran necesarias. Además, sus resultados se relacionan con el análisis del proceso de embotellamiento."},{"t":"h","l":3,"h":"6.4.1. La Encuesta","x":"6.4.1. La Encuesta"},{"t":"p","h":"De acuerdo con Hernández Sampieri et al. (2006, p. 310), el cuestionario es uno de los instrumentos más utilizados para recolectar datos y consiste en un conjunto de preguntas sobre una o más variables que se quieren medir. La encuesta es un instrumento cuantitativo que aplica ese cuestionario a un grupo de personas para obtener información medible. En este proyecto es la herramienta que mide la opinión del personal vinculado a la línea.","x":"De acuerdo con Hernández Sampieri et al. (2006, p. 310), el cuestionario es uno de los instrumentos más utilizados para recolectar datos y consiste en un conjunto de preguntas sobre una o más variables que se quieren medir. La encuesta es un instrumento cuantitativo que aplica ese cuestionario a un grupo de personas para obtener información medible. En este proyecto es la herramienta que mide la opinión del personal vinculado a la línea."},{"t":"p","h":"La encuesta de este proyecto mide cinco variables sobre el consumo de yogurt y los problemas del envase, y se aplica a diez estudiantes de la universidad. Sus resultados numéricos y porcentuales se tabulan en Excel, se presentan con un mismo tipo de gráfico y se analizan junto con la entrevista, para complementar el diagnóstico de las fallas del envasado. Así se obtienen datos medibles que respaldan los hallazgos.","x":"La encuesta de este proyecto mide cinco variables sobre el consumo de yogurt y los problemas del envase, y se aplica a diez estudiantes de la universidad. Sus resultados numéricos y porcentuales se tabulan en Excel, se presentan con un mismo tipo de gráfico y se analizan junto con la entrevista, para complementar el diagnóstico de las fallas del envasado. Así se obtienen datos medibles que respaldan los hallazgos."},{"t":"h","l":3,"h":"6.4.2. La Entrevista","x":"6.4.2. La Entrevista"},{"t":"p","h":"Según Díaz-Bravo et al. (2013), la entrevista es una conversación planificada entre el entrevistador y el entrevistado para obtener información, y en su modalidad semiestructurada parte de una guía de preguntas que puede ajustarse durante el diálogo. Se trata de un recurso cualitativo que permite conocer la experiencia directa de las personas que participan en un proceso. Permite comprender las fallas desde la experiencia del personal.","x":"Según Díaz-Bravo et al. (2013), la entrevista es una conversación planificada entre el entrevistador y el entrevistado para obtener información, y en su modalidad semiestructurada parte de una guía de preguntas que puede ajustarse durante el diálogo. Se trata de un recurso cualitativo que permite conocer la experiencia directa de las personas que participan en un proceso. Permite comprender las fallas desde la experiencia del personal."},{"t":"p","h":"En este proyecto se aplica una entrevista de cinco preguntas abiertas a diez estudiantes de la universidad. Su propósito es conocer los problemas que han tenido con los envases de yogurt, lo que revisan al comprarlo y los cambios que propondrían, y sus respuestas se agrupan en categorías según su similitud. Además, permite reconocer propuestas de mejora que vienen del propio consumidor del producto.","x":"En este proyecto se aplica una entrevista de cinco preguntas abiertas a diez estudiantes de la universidad. Su propósito es conocer los problemas que han tenido con los envases de yogurt, lo que revisan al comprarlo y los cambios que propondrían, y sus respuestas se agrupan en categorías según su similitud. Además, permite reconocer propuestas de mejora que vienen del propio consumidor del producto."},{"t":"h","l":2,"h":"6.5. Población/Muestra","x":"6.5. Población/Muestra"},{"t":"p","h":"La población o muestra de esta investigación han sido diez estudiantes de la Universidad Militar Nueva Granada entrevistados y otros diez estudiantes de la misma universidad a quienes se les aplicó la encuesta, es decir, veinte personas en total. Hernández Sampieri et al. (2014) definen la población como el conjunto de todos los casos que concuerdan con determinadas especificaciones, lo cual orienta su delimitación.","x":"La población o muestra de esta investigación han sido diez estudiantes de la Universidad Militar Nueva Granada entrevistados y otros diez estudiantes de la misma universidad a quienes se les aplicó la encuesta, es decir, veinte personas en total. Hernández Sampieri et al. (2014) definen la población como el conjunto de todos los casos que concuerdan con determinadas especificaciones, lo cual orienta su delimitación."},{"t":"p","h":"La muestra es el subgrupo de la población del cual se recolectan los datos (Hernández Sampieri et al., 2014). En este proyecto se seleccionan veinte estudiantes: diez para la entrevista y otros diez para la encuesta. Se trata de una muestra no probabilística, elegida por conveniencia y por su cercanía con el consumo de yogurt. Con ello se busca obtener información útil sobre la percepción de los consumidores del producto.","x":"La muestra es el subgrupo de la población del cual se recolectan los datos (Hernández Sampieri et al., 2014). En este proyecto se seleccionan veinte estudiantes: diez para la entrevista y otros diez para la encuesta. Se trata de una muestra no probabilística, elegida por conveniencia y por su cercanía con el consumo de yogurt. Con ello se busca obtener información útil sobre la percepción de los consumidores del producto."},{"t":"h","l":2,"h":"6.6. Planeador","x":"6.6. Planeador"},{"t":"p","h":"El planeador registra las actividades desarrolladas durante el curso de Metodología de la Investigación para construir este proyecto, con la fecha de cada una, el logro que se buscaba y una explicación de lo que hizo el grupo. La Tabla 2 muestra la secuencia de trabajo, desde la introducción a la investigación hasta las asesorías en las que se recibieron correcciones.","x":"El planeador registra las actividades desarrolladas durante el curso de Metodología de la Investigación para construir este proyecto, con la fecha de cada una, el logro que se buscaba y una explicación de lo que hizo el grupo. La Tabla 2 muestra la secuencia de trabajo, desde la introducción a la investigación hasta las asesorías en las que se recibieron correcciones."},{"t":"p","h":"<strong>Tabla 2<\/strong>","x":"Tabla 2"},{"t":"p","h":"<em>Planeador de Actividades del Proyecto de Investigación<\/em>","x":"Planeador de Actividades del Proyecto de Investigación"},{"t":"tbl","rows":[["<strong>Fecha<\/strong>","<strong>Actividad<\/strong>","<strong>Logro de la actividad<\/strong>","<strong>Explicación de la actividad<\/strong>"],["24/07/2026","Introducción a la investigación en la universidad","Entender cómo se trabaja la investigación en la carrera","Sesión inicial en la que se presentaron los lineamientos del trabajo de investigación y su forma de evaluación."],["31/07/2026","Exposiciones","Conocer los elementos que debe llevar un proyecto de investigación","Se presentaron los apartados que componen un proyecto de investigación y se resolvieron dudas."],["14/08/2026","Definición del tema","Elegir el tema central de la investigación","El grupo definió trabajar en la aplicación de Lean Manufacturing en el embotellamiento de yogurt de Parmalat."],["21/08/2026","Definición de título, objetivos y pregunta problema","Dejar estructurada la parte principal de la propuesta","Se formularon el título, el objetivo general, los objetivos específicos y la pregunta problema."],["28/08/2026","Primera asesoría del proyecto","Recibir correcciones para mejorar el trabajo","Se revisaron los avances del documento y se recibieron observaciones de la docente."],["04/09/2026","Segunda asesoría del proyecto","Verificar la incorporación de las correcciones
